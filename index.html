<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>HedgeRight — native hedgerow planner</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{
  --paper:#EEF0E8; --paper2:#E2E6DA; --ink:#1E2A22; --mute:#6F7D72; --line:#C9D0C3;
  --water:#2F6FA3; --water2:#DCE8F3; --alert:#B4471E; --ok:#3D7A4A; --warn:#A67A1B;
  --sel:#1E2A22;
  --panelW:372px; --tapeH:176px;
  font-family:"Atkinson Hyperlegible",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--paper);color:var(--ink);font-family:inherit;font-size:15px;line-height:1.35}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:var(--paper2);border:1px solid var(--line);border-radius:6px;padding:6px 10px}
button:hover{border-color:var(--mute)}
button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
button.small{padding:3px 8px;font-size:13px}
button.danger{color:var(--alert);border-color:var(--alert)}
button.danger:hover{background:#F1D8CC}
/* The one "do this next" signal in the app — ink fill, bold, everywhere it means the
   same thing. Mirrors #stageBar .nxt, which already used this pattern; generalized so
   any button can carry it instead of just the stage bar. */
button.primary{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:700}
button.primary:hover{background:#16201A;border-color:#16201A}
button:disabled{opacity:.42;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--water);outline-offset:1px}
input[type=text],input[type=number],select{background:#fff;border:1px solid var(--line);border-radius:6px;padding:5px 8px;width:100%}
input[type=number]{width:88px}
label{display:block;font-size:13px;color:var(--mute);margin:8px 0 3px}
h1{font-size:19px;margin:0;font-weight:700;letter-spacing:-.01em}
.stitle .hrlogo{width:132px;height:78px}
#panelHead h1{gap:10px}
#headBtns{margin-left:auto;display:flex;gap:6px;align-items:center}
body.viewer [data-vl]{opacity:.45;cursor:not-allowed}
#speciesGrid.ro #sgTable input:disabled,#speciesGrid.ro #sgTable select:disabled,#speciesGrid.ro #sgTable textarea:disabled{opacity:1;color:inherit;background:transparent;border-color:transparent}
#speciesGrid.ro .sgDel{display:none}
h2{font-size:15px;margin:16px 0 6px;font-weight:700}
h3{font-size:14px;margin:12px 0 4px;font-weight:700}
p{margin:6px 0}
.mute{color:var(--mute)} .small{font-size:13px}
.ok{color:var(--ok)} .alert{color:var(--alert)} .warn{color:var(--warn)}

#app{display:grid;grid-template-columns:var(--panelW) 1fr;grid-template-rows:1fr;height:100%;overflow:hidden}
#panel{background:var(--paper);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#panelHead{padding:12px 14px 8px;border-bottom:1px solid var(--line)}
#panelHead .sub{font-size:13px;color:var(--mute);margin-top:2px}
#tabs{display:flex;gap:0;border-bottom:1px solid var(--line)}
#tabs button{flex:1;border:0;border-radius:0;background:transparent;padding:9px 2px;font-size:13px;border-bottom:3px solid transparent}
#tabs button.on{background:transparent;color:var(--ink);border-bottom-color:var(--ink)}
#panelBody{overflow:auto;padding:10px 14px 16px;flex:1;min-height:0}
#stageBar{display:flex;gap:8px;align-items:center;padding:8px 12px;border-top:1px solid var(--line);background:var(--paper);
  box-shadow:0 -2px 10px rgba(0,0,0,.06);flex:0 0 auto}
#stageBar .grow{flex:1;min-width:0}
#stageBar .nxt{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:700;white-space:nowrap}
#stageBar .nxt:disabled{opacity:.4}
#stageBar .why{font-size:12px;color:var(--mute);line-height:1.25}
@media (max-width:820px){#stageBar{padding:6px 10px}#stageBar .why{display:none}}
.tab{display:none}.tab.on{display:block}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>*{flex:0 0 auto}
.grow{flex:1 1 auto !important}
.card{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:8px 0;background:#fff}
.card.sel{border-color:var(--ink);box-shadow:inset 3px 0 0 var(--ink)}
.card h3{margin:0 0 4px}
.list .card{cursor:pointer}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:3px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mute);font-weight:400}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}

#mapWrap{position:relative;min-width:0;display:grid;grid-template-rows:1fr auto}
#map{width:100%;height:100%;background:#0f1512}
#modebar{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:900;display:flex;gap:6px;background:rgba(238,240,232,.94);padding:6px;border-radius:10px;border:1px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,.25)}
#modebar button{white-space:nowrap}
#m-finish{background:var(--paper2);color:var(--mute)}
#m-finish.ready{background:var(--ok);color:#fff;border-color:var(--ok);font-weight:700}
#m-finish:disabled{cursor:default;opacity:.75}
#readout{position:absolute;left:10px;bottom:calc(var(--tapeH) + 12px);z-index:800;background:rgba(30,42,34,.92);color:#EEF0E8;padding:6px 10px;border-radius:8px;font-size:13px;max-width:70%;pointer-events:none}
#readout:empty{display:none}
#hexTip{position:absolute;right:10px;top:64px;z-index:700;background:rgba(238,240,232,.96);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;width:250px;display:none;box-shadow:0 2px 8px rgba(0,0,0,.25)}
#hexTip.show{display:block}
#hexTip b{font-weight:700}
#layerBox{position:absolute;right:10px;bottom:calc(var(--tapeH) + 12px);z-index:800;background:rgba(238,240,232,.94);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:13px;display:flex;flex-direction:column;gap:3px}
#layerBox label{margin:0;display:flex;gap:6px;align-items:center;color:var(--ink);cursor:pointer}
#heatLegend:empty{display:none}
#heatLegend{border-top:1px solid var(--line);margin-top:4px;padding-top:5px;font-size:12px;width:200px}

#tape{height:var(--tapeH);z-index:1;position:relative;border-top:1px solid var(--line);background:var(--paper);overflow:hidden;display:flex;flex-direction:column}
#tape.hidden{display:none}
#growDock{position:absolute;left:0;right:0;bottom:calc(var(--tapeH) + 1px);z-index:850;background:rgba(238,240,232,.97);border-top:1px solid var(--line);
  box-shadow:0 -3px 14px rgba(0,0,0,.16);display:none;flex-direction:column;max-height:190px}
#growDock.show{display:flex}
#mapWrap.notape #growDock{bottom:0}
#mapWrap.docked #readout,#mapWrap.docked #layerBox{bottom:calc(var(--tapeH) + 200px)}
#mapWrap.notape.docked #readout,#mapWrap.notape.docked #layerBox{bottom:200px}
.dockHead{display:flex;gap:10px;align-items:center;padding:5px 12px;border-bottom:1px solid var(--line);font-size:13px}
.dockBody{display:flex;gap:14px;padding:8px 12px;overflow:auto}
.dockFacts{flex:0 0 240px;min-width:200px}
.dockCols{display:flex;gap:16px;flex:1;overflow-x:auto}
.dockCol h4{margin:0 0 3px;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);font-weight:400}
/* A column is as wide as its longest name, up to a cap, and never shrinks below its content —
   before, min-width was the only rule, so a long name (nowrap) simply painted over the next
   column. Past the cap the name is cut with an ellipsis (the full name is the tooltip); the
   swatch and percentage keep their size so only the name gives way. */
.dockCol{flex:0 0 auto;min-width:150px;max-width:260px}
.dockSp{display:flex;gap:6px;align-items:center;font-size:13px;padding:2px 5px;border-radius:5px;cursor:pointer;border:1px solid transparent;white-space:nowrap}
.dockSp:hover{background:#fff;border-color:var(--line)}
.dockSp.in{background:#fff;border-color:var(--ink)}
.dockSeg{display:inline-flex;margin-left:10px}
.dockSeg button{border-radius:0;margin-left:-1px}
.dockSeg button:first-child{border-radius:7px 0 0 7px;margin-left:0}
.dockSeg button:last-child{border-radius:0 7px 7px 0}
.dockSp .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.dockSp .swatch{flex:0 0 auto}
.dockSp .fit{flex:0 0 auto;font-variant-numeric:tabular-nums;font-size:12px;color:var(--mute)}
.dockTab{position:absolute;right:12px;bottom:6px;font-size:12px}
#growDock:not(.show) .dockTab{display:none}
@media (max-width:820px){#growDock{max-height:44vh;bottom:0}.dockBody{flex-direction:column;gap:8px}.dockFacts{flex:none}}
#mapWrap.notape #readout,#mapWrap.notape #layerBox{bottom:12px}
@media (max-width:820px){#mapWrap.notape #readout{bottom:auto;top:8px}#mapWrap.notape #layerBox{bottom:auto;top:44px}}
#tapeHead{display:flex;gap:10px;align-items:center;padding:4px 12px;font-size:13px;color:var(--mute)}
#tapeHead b{color:var(--ink)}
#tapeScroll{flex:1;overflow:auto;display:flex;align-items:flex-start}
#tapeLabels{position:sticky;left:0;z-index:2;background:var(--paper);flex:none;width:180px;border-right:1px solid var(--line);font-size:11px;color:var(--ink)}
.tapeLab{display:flex;align-items:center;gap:5px;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-sizing:border-box;line-height:1}
.tapeLab i{width:9px;height:9px;border-radius:50%;border:1px solid #111;flex:none}
.tapeLab span{color:var(--mute)}
.tapeLab.ns{border-top:1px solid var(--line)}
#tapeSvg{flex:none}
#tapeSvg{display:block}
.tapeDot{cursor:pointer}
.tapeDot:hover{stroke:var(--ink);stroke-width:2}

.swatch{display:inline-block;width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.3);vertical-align:-2px;margin-right:6px}
.sp{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:6px;cursor:pointer;border:1px solid transparent}
.sp:hover{background:#fff}
.sp.on{border-color:var(--ink);background:#fff}
.sp.excluded{opacity:.5}
.sp.excluded .n{color:var(--mute)}
.sp .n{flex:1;min-width:0}
.sp .n i{color:var(--mute);font-size:12px;display:block;font-style:italic}
.bigbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 14px;border-radius:12px;
  border:1px solid var(--line);background:#fff;margin:8px 0;line-height:1.25}
.bigbtn:hover{border-color:var(--ink);box-shadow:0 2px 10px rgba(0,0,0,.08)}
.bigbtn .ic{width:64px;height:44px;flex:0 0 auto}
.bigbtn b{display:block;font-size:15px}
.bigbtn i{display:block;font-style:normal;font-size:13px;color:var(--mute);margin-top:2px}
.bigbtn.primary{background:linear-gradient(180deg,#F3F5EC,#E7EBDD);border:2px solid var(--ink)}
.bigbtn.primary b{color:var(--ink)}
.bigbtn:disabled{opacity:.5;cursor:not-allowed}
.bigrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bigrow .bigbtn{margin:0}
@media (max-width:820px){.bigrow{grid-template-columns:1fr}}
.addbtn{font-size:11px;padding:2px 7px;border-radius:11px;border:1px solid var(--line);background:var(--paper2);color:var(--mute);white-space:nowrap;min-width:62px}
.addbtn:hover{border-color:var(--ink);color:var(--ink)}
.addbtn.in{background:#DCE9DD;border-color:var(--ok);color:var(--ok);font-weight:700}
.mark{font-size:11px;color:var(--mute);white-space:nowrap;min-width:56px;text-align:right}
.sp.on .mark,.dockSp.in .mark{color:var(--ok);font-weight:700}
.sp .fit{width:52px;text-align:right;font-size:12px;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:var(--paper2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.pill{display:inline-block;font-size:12px;padding:1px 7px;border-radius:10px;background:var(--paper2);margin:1px 2px 1px 0}
.pill.w{background:var(--water2);color:var(--water)}
.hint{font-size:13px;color:var(--mute);padding:8px 10px;border:1px dashed var(--line);border-radius:8px;margin:8px 0}
details summary{cursor:pointer;color:var(--mute);font-size:13px}
.leaflet-container{font-family:inherit}
/* Leaflet toggles its own grab/grabbing cursor via CSS classes whenever map dragging is
   enabled — which it needs to be during drawing modes, so you can pan to reach a distant
   point. That class-based cursor can outrun a plain inline style, so force it here: while
   actively drawing, the cursor is always crosshair, never a hand implying a point can be
   dragged (it can't — only Select mode's centerline handles are draggable). */
#map.hr-drawing,#map.hr-drawing .leaflet-grab,#map.hr-drawing .leaflet-interactive:not(.vh){cursor:crosshair!important}
.vh{cursor:grab!important}
.leaflet-tooltip.rowlab{background:rgba(30,42,34,.9);color:#EEF0E8;border:0;font-size:12px;padding:2px 6px;border-radius:4px;box-shadow:none}
.leaflet-tooltip.rowlab::before{display:none}
.vh{width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.4)}
.wnode{display:flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:var(--water);color:#fff;font-size:12px;font-weight:700;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.5)}
.wnode.sel{background:var(--ink)}
.wnode.tank{border-radius:5px}
.wnode.reg{background:var(--warn)}
.wnode.outlet{background:var(--ok)}
.wnode.pond{background:#4C8FBF;border-radius:40%}

/* dialogs, toasts, network badge, provenance, history */
#dlg{position:fixed;inset:0;z-index:3000;background:rgba(30,42,34,.42);display:none;align-items:center;justify-content:center;padding:20px}
#dlg.show{display:flex}
.dlgbox{background:var(--paper);border:1px solid var(--line);border-radius:12px;max-width:440px;width:100%;padding:16px 18px;box-shadow:0 12px 40px rgba(0,0,0,.35);max-height:calc(100vh - 40px);display:flex;flex-direction:column}
#dlgB{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.dlgbox h3{margin:0 0 8px;font-size:17px}
.dlgA{justify-content:flex-end;margin-top:14px;gap:8px}
.dlgA button.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.dlgA button.danger{background:var(--alert);color:#fff;border-color:var(--alert)}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,16px);z-index:3100;background:var(--ink);color:var(--paper);
  border-radius:10px;padding:9px 12px;font-size:13px;display:flex;gap:10px;align-items:center;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;box-shadow:0 6px 24px rgba(0,0,0,.35)}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{background:transparent;color:var(--paper);border:1px solid rgba(238,240,232,.45)}
#netBadge{display:none;font-size:12px;padding:3px 8px;border-radius:9px;margin-left:6px}
#netBadge.show{display:inline-block}
#netBadge.busy{background:var(--water2);color:var(--water)}
#netBadge.bad{background:#F1D8CC;color:var(--alert)}
#saveWrap{position:relative;display:inline-flex}
#saveBtn{font-size:12px;padding:3px 9px;border-radius:7px 0 0 7px;border-right:0}
#saveBtn.dirty{background:#F6EBD2;border-color:#E4D3A8;color:var(--warn);font-weight:700}
#saveMore{font-size:11px;padding:3px 6px;border-radius:0 7px 7px 0}
#saveWrap .menu{display:none;position:absolute;top:26px;left:0;z-index:1500;background:var(--paper);border:1px solid var(--line);
  border-radius:10px;box-shadow:0 8px 26px rgba(0,0,0,.25);min-width:236px;padding:5px;flex-direction:column}
#saveWrap.open .menu{display:flex}
#saveWrap .menu button{background:transparent;border:0;text-align:left;padding:7px 10px;border-radius:6px;font-size:13px;display:flex;justify-content:space-between;gap:12px}
#saveWrap .menu button:hover{background:var(--paper2)}
#saveWrap .menu kbd{color:var(--mute);font-size:11px}
#saveWrap .menu .sep{height:1px;background:var(--line);margin:4px 6px}
/* Hedgerow navigator: the ranch subtitle doubles as a menu button. Styled to read as
   text with a dotted underline until hovered, not as another toolbar button. */
#ranchSub .hedgeSel{display:flex;align-items:center;gap:8px;margin-top:5px}
#ranchSub .hedgeSel span{font-weight:600;color:var(--ink);white-space:nowrap}
#ranchSub .hedgeSel select{flex:1;min-width:0;max-width:100%;font-size:13px;padding:4px 6px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink)}
#hedgeNavWrap{position:relative;display:inline-block}
#hedgeNavBtn{all:unset;display:inline;cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
#hedgeNavBtn:hover{color:var(--ink)}
#hedgeNavBtn:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:3px}
#hedgeNavWrap .menu{position:absolute;top:22px;left:0;z-index:1500;background:var(--paper);border:1px solid var(--line);
  border-radius:10px;box-shadow:0 8px 26px rgba(0,0,0,.25);min-width:270px;padding:5px;display:flex;flex-direction:column}
#hedgeNavWrap .menu button{background:transparent;border:0;text-align:left;padding:7px 10px;border-radius:6px;font-size:13px;display:flex;justify-content:space-between;gap:14px;white-space:nowrap;color:var(--ink)}
#hedgeNavWrap .menu button:hover{background:var(--paper2)}
#hedgeNavWrap .menu button.on{font-weight:700}
#hedgeNavWrap .menu .sep{height:1px;background:var(--line);margin:4px 6px}
#hedgeNavWrap .menu kbd{color:var(--mute);font-size:11px}
#saveState{font-size:12px;padding:3px 8px;border-radius:9px;margin-left:2px;cursor:pointer;border:1px solid transparent}
#saveState.ok{color:var(--mute)}
#saveState.dirty{background:#F6EBD2;color:var(--warn);border-color:#E4D3A8}
#saveState.writing{color:var(--water)}
#saveState:hover{border-color:var(--line)}
.prov{font-size:10px;text-transform:uppercase;letter-spacing:.03em;border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:5px;color:var(--mute);cursor:help;vertical-align:1px}
#modeBanner{position:absolute;top:56px;left:50%;transform:translateX(-50%);z-index:880;background:var(--ink);color:var(--paper);
  font-size:13px;padding:6px 12px;border-radius:9px;display:none;gap:10px;align-items:center;box-shadow:0 2px 10px rgba(0,0,0,.3);transition:top .15s ease}
#mapWrap.busy-active #modeBanner{top:148px}
@media (max-width:820px){#mapWrap.busy-active #modeBanner{top:auto}}
#modeBanner.show{display:flex}
#modeBanner .cta{background:var(--paper);color:var(--ink);border-radius:6px;padding:3px 8px;animation:hrpulse 1.6s ease-in-out infinite}
@keyframes hrpulse{0%,100%{opacity:.85}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){#modeBanner .cta{animation:none}}
#modeBanner kbd{background:rgba(238,240,232,.16);border-radius:4px;padding:1px 5px;font:inherit}
#histBar{display:flex;gap:6px;align-items:center}
#histBar button:disabled{opacity:.35;cursor:default}
@media (max-width:820px){#modeBanner{top:auto;bottom:74px;left:6px;right:6px;transform:none;justify-content:center;flex-wrap:wrap}}

/* stage rail + resizable inspector */
#tabs{display:flex;gap:0;border-bottom:1px solid var(--line);position:relative}
#tabs button{flex:1;border:0;border-radius:0;background:transparent;padding:9px 2px 8px;font-size:12px;border-bottom:3px solid transparent;color:var(--mute);position:relative}
#tabs button .stepn{display:block;font-size:10px;opacity:.65;letter-spacing:.04em}
#tabs button.on{color:var(--ink);border-bottom-color:var(--ink);font-weight:700}
#tabs button.done{color:var(--ink)}
#tabs button.done .stepn::after{content:" ✓";color:var(--ok)}
#tabs button:disabled{opacity:.42;cursor:not-allowed}
#grip{position:absolute;top:0;bottom:0;right:-3px;width:7px;cursor:col-resize;z-index:1200}
#grip:hover,#grip.drag{background:linear-gradient(90deg,transparent 2px,var(--water) 2px,var(--water) 4px,transparent 4px)}
#panel{position:relative}
#collapse{position:absolute;top:8px;right:10px;z-index:5}
#panel.collapsed{--panelW:0}
@media (max-width:820px){#grip{display:none}}
#panelToggle{display:none}
#start{position:fixed;inset:0;z-index:2000;background:var(--paper);display:none;overflow:auto;padding:28px 16px 40px}
#start.show{display:block}
#startInner{max-width:620px;margin:0 auto}
/* Full-page species spreadsheet editor. The action bar sits outside the scrolling
   area entirely (a separate flex child, not a sticky element within it) so it's
   always visible with zero stacking-context fuss; the table's own header row uses
   position:sticky relative to the scroll container beneath it, landing right under
   the bar with no overlap. */
#speciesGrid{position:fixed;inset:0;z-index:2500;background:var(--paper);display:none;flex-direction:column}
#speciesGrid.show{display:flex}
/* Shown over the whole spreadsheet while "Update all" runs: the run replaces rows in the editing copy, so nothing

/* Common name stays visible while scrolling horizontally through the other ~30

   underneath would show through; the header cell is sticky in both directions at
   once (top from the rule above, left from here) and needs the highest z-index of

#sgTable td.sgFreeze{position:sticky;left:0;z-index:3;background:var(--paper)}

   as plain text, not as something clickable or typeable. */

#igTable textarea{resize:vertical;min-height:26px;min-width:140px}

#busy.show{display:flex}
#busy .hrlogo{width:120px;height:70px}
/* the hedge grows left to right like a loading bar: ground sweeps, then each plant springs up in turn */
#busy .ground{stroke-dasharray:90;stroke-dashoffset:90}
#busy .p{transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(0);opacity:0}
#busy .bee{opacity:0}
#busy.show:not(.done) .ground{animation:hrground 4s cubic-bezier(.35,0,.25,1) infinite}
#busy.show:not(.done) .p{animation:hrspring 4s cubic-bezier(.34,1.56,.64,1) infinite}
#busy.show:not(.done) .p1{animation-delay:.25s} #busy.show:not(.done) .p2{animation-delay:.65s}
#busy.show:not(.done) .p3{animation-delay:1.05s} #busy.show:not(.done) .p4{animation-delay:1.45s}
#busy.show:not(.done) .bee{animation:hrbee 4s cubic-bezier(.4,0,.5,1) infinite}
#busy.show:not(.done) .beebody{animation:hrbob .55s ease-in-out infinite}
#busy.show:not(.done) .wing{transform-box:fill-box;transform-origin:80% 50%;animation:hrwing .09s linear infinite}
#busy.done .ground{stroke-dashoffset:0} #busy.done .p{transform:none;opacity:1} #busy.done .bee{opacity:1;transform:translate(83px,26px)}
@keyframes hrground{0%{stroke-dashoffset:90}45%{stroke-dashoffset:0}100%{stroke-dashoffset:0}}
@keyframes hrspring{0%,8%{transform:scaleY(0);opacity:0}22%{transform:scaleY(1.08);opacity:1}30%{transform:scaleY(1);opacity:1}94%{transform:scaleY(1);opacity:1}100%{transform:scaleY(1);opacity:0}}
@keyframes hrbee{0%,42%{opacity:0;transform:translate(6px,4px)}46%{opacity:1;transform:translate(20px,2px)}55%{transform:translate(44px,-6px)}63%{transform:translate(62px,6px)}71%{transform:translate(72px,-8px)}79%{transform:translate(84px,-2px)}86%,96%{transform:translate(83px,26px)}100%{opacity:0;transform:translate(83px,26px)}}
@keyframes hrbob{0%,100%{transform:rotate(-14deg) translateY(0)}50%{transform:rotate(-11deg) translateY(-.7px)}}
@keyframes hrwing{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.35)}}
@media (prefers-reduced-motion:reduce){#busy .ground,#busy .p,#busy .bee,#busy .beebody,#busy .wing{animation:none!important} #busy .ground{stroke-dashoffset:0} #busy .p{transform:none;opacity:1} #busy .bee{opacity:1}}

<body>
<div id="start"><div id="startInner"><div id="startBody"></div></div></div>
<div id="speciesGrid">
  <div id="sgBar">
    <h2>Edit species library</h2>
    <input id="sgSearch" type="search" placeholder="Search any field…" autocomplete="off" spellcheck="false"
      title="Shows only species where every word you type matches some field: name, notes, moisture, a goal, a bloom month, what it replaces… (space means AND). Esc clears."
      oninput="setSgFilter(this.value)" onkeydown="if(event.key==='Escape'){ this.value=''; setSgFilter(''); event.stopPropagation(); }">
    <span class="small mute" id="sgCount"></span>
    <span class="small mute" id="sgStatus"></span>
    <span class="grow"></span>
    <button class="small" id="sgUpdAll" style="display:none" onclick="sgUpdateAll()" title="Asks the nursery about every species here, one a second: refreshes prices, stock and sizes available, and fills what is blank. Species it does not list are skipped. Nothing is kept until you press Save.">Update all from nursery</button>
    <button class="small" id="sgWeb" style="display:none" onclick="sgWebFill()" title="Looks up every species that has blank fields (height, width, bloom months, flower color, sun, water, cold tolerance, deer, leaf habit, native) on Calscape and Calflora and fills only the blanks. Nothing is kept until you press Save.">Fill blanks from the web</button>

    <button class="small" id="sgWs" style="display:none" onclick="wsAddMissing()" title="Adds the species the Watershed Nursery Cooperative lists that the library does not have, as drafts with only a name, layer and sizes filled in.">Add Watershed species</button>
    <button class="small" id="sgNative" style="display:none" onclick="sgFillNative()" title="One-time pass: fills the blank Native status cells from the nursery's North Bay flag, from cultivar names, and from a built-in list of California natives, and shows you what it will write first. Cells that already have a value are never touched; Save keeps the result.">Fill native status</button>
    <button class="small" id="sgImport" style="display:none" onclick="openImportGrid()" title="Opens an empty sheet where you can load plants from a Cal Flora Nursery Plant Finder address, look them over and edit them, and add only the ones you tick.">Import from Cal Flora Nursery…</button>
    <button class="small" onclick="downloadSpeciesJSON()" title="Downloads the whole library, edits included, whether or not you've saved yet. The search box only hides rows; it never limits what is downloaded or saved.">Download</button>
    <button class="small danger" onclick="cancelSpeciesGrid()">Cancel</button>
    <button class="small primary" onclick="saveSpeciesGrid()">Save</button>

  <div id="sgScroll"><table id="sgTable"></table></div>

      <p id="sgpNow" class="small"></p>
      <p id="sgpTally" class="small mute"></p>
      <div id="sgpActions"><button class="small danger" id="sgpStop" onclick="sgUpdateAll()">Stop</button></div>
    </div>
  </div>
</div>

<script>
/* Capture the pristine page source as the very first thing this script does,
   before any DOM mutation (map init, panel renders, etc.) touches it — this
   is what the Download button saves, so it always reflects a clean, working copy. */
const _PAGE_SRC='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
function downloadApp(){
  try{ const blob=new Blob([_PAGE_SRC],{type:'text/html'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='hedgeright.html';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(a.href),2000);
    UI.toast('Downloading hedgeright.html'); }
  catch(e){ alert('Could not prepare the download: '+(e.message||e)); } }

/* ---------------- cloud sync (Cloudflare Worker + KV) ----------------
   One shared JSON blob, gated by a password set once per device. The Worker URL is
   fixed for this deployment; only the password lives in localStorage — recoverable
   from wherever you actually keep it (a password manager), same as any login. */
const CLOUD_SYNC_BASE='https://hedgeright-sync.eric-carlson.workers.dev';
let cloudStatus={state:'unconfigured',msg:'',at:null};
let cloudIdentity={role:null,name:null};
let _cloudUpdatedAt=null; /* what we believe the server's current version is, from our last successful pull or push */
function accessCode(){ try{ return localStorage.getItem('hedgeright.accessCode')||''; }catch(e){ return ''; } }
function setAccessCode(t){ try{ localStorage.setItem('hedgeright.accessCode',t); }catch(e){} }
function cloudDeployed(){ return !!(CLOUD_SYNC_BASE&&!CLOUD_SYNC_BASE.includes('YOUR-WORKER-SUBDOMAIN')); }
function cloudConfigured(){ return cloudDeployed()&&!!accessCode(); }
async function cloudPull(){
  if(!cloudConfigured()) return null;
  try{ const r=await fetch(CLOUD_SYNC_BASE+'/design',{headers:{'Authorization':'Bearer '+accessCode()}});
    if(r.status===401){ cloudStatus={state:'error',msg:'invalid access code',at:Date.now()}; renderCloudStatus(); return null; }
    if(!r.ok) throw new Error('HTTP '+r.status);
    const js=await r.json(); cloudStatus={state:'ok',msg:'synced',at:Date.now()}; _cloudUpdatedAt=js.updatedAt!==undefined?js.updatedAt:null; renderCloudStatus();
    return js.data||null; }
  catch(e){ cloudStatus={state:'error',msg:(e&&e.message)||String(e),at:Date.now()}; renderCloudStatus(); return null; } }
async function cloudPush(){
  if(!cloudConfigured()) return;
  if(cloudIdentity.role==='viewer'){ cloudStatus={state:'error',msg:"view-only access — this change wasn't saved to the shared design",at:Date.now()}; renderCloudStatus(); return; }
  try{ const r=await fetch(CLOUD_SYNC_BASE+'/design',{method:'PUT',headers:{'Authorization':'Bearer '+accessCode(),'Content-Type':'application/json'},body:JSON.stringify({data:S,expectedUpdatedAt:_cloudUpdatedAt})});
    if(r.status===403){ cloudStatus={state:'error',msg:"view-only access — this change wasn't saved to the shared design",at:Date.now()}; renderCloudStatus(); return; }
    if(r.status===401){ cloudStatus={state:'error',msg:'invalid access code',at:Date.now()}; renderCloudStatus(); return; }
    if(!r.ok) throw new Error('HTTP '+r.status);
    const js=await r.json(); _cloudUpdatedAt=js.updatedAt; cloudStatus={state:'ok',msg:'synced',at:Date.now()}; }
  catch(e){ cloudStatus={state:'error',msg:(e&&e.message)||String(e),at:Date.now()}; }
  renderCloudStatus(); }
/* Reloading replaces S with whatever is currently on the server — only ever triggered
   by the person explicitly clicking "Reload" on a conflict/staleness toast, never
   automatically, since it discards whatever unsaved local edit prompted the warning. */
async function reloadFromCloud(){
  const data=await cloudPull();
  if(data){ S=data; normalizeState(); if(map){ const lv=myViewFor(R().id); map.setView(lv?lv.center:R().center,lv?lv.zoom:R().zoom); drawAll(); if(hexOn) drawHexes(); if(heatOn) drawHeat(); } renderPanels(); UI.toast('Reloaded from the shared design.'); } }
/* Opportunistic check, not a poll loop: whenever the tab regains focus, ask the server
   what its current version is (cheap — one GET) and compare against what we last saw.
   If it's newer, someone else has saved since we loaded — say so and offer to reload,
   without touching S until the person chooses to. */
async function checkStale(){
  if(!cloudConfigured()) return;
  try{ const r=await fetch(CLOUD_SYNC_BASE+'/design',{headers:{'Authorization':'Bearer '+accessCode()}});
    if(!r.ok) return; const js=await r.json();
    if(_cloudUpdatedAt!==null&&js.updatedAt!==null&&js.updatedAt>_cloudUpdatedAt){
      UI.toast((js.updatedBy?js.updatedBy+' updated':'Someone updated')+' the shared design since this loaded.',{label:'Reload',fn:reloadFromCloud}); } }
  catch(e){} }
async function cloudWhoAmI(){
  if(!cloudConfigured()){ cloudIdentity={role:null,name:null}; renderCloudStatus(); renderPeopleAccess(); renderSpeciesAdmin(); return; }
  try{ const r=await fetch(CLOUD_SYNC_BASE+'/whoami',{headers:{'Authorization':'Bearer '+accessCode()}});
    if(!r.ok){ cloudIdentity={role:null,name:null}; renderCloudStatus(); renderPeopleAccess(); renderSpeciesAdmin(); return; }
    const js=await r.json(); cloudIdentity={role:js.role,name:js.name}; }
  catch(e){ cloudIdentity={role:null,name:null}; }
  renderCloudStatus(); renderPeopleAccess(); renderSpeciesAdmin(); }
function renderCloudStatus(){ const els=document.querySelectorAll('.cloudStatusEl'); if(!els.length) return;
  let text;
  if(!cloudDeployed()) text='Worker not deployed yet.';
  else if(!accessCode()) text='No access code set on this device.';
  else if(cloudStatus.state==='error') text='Sync failed: '+cloudStatus.msg;
  else if(cloudIdentity.role) text='Signed in as '+cloudIdentity.name+' ('+cloudIdentity.role+')'+(cloudStatus.state==='ok'&&cloudStatus.at?' · synced '+new Date(cloudStatus.at).toLocaleTimeString():'');
  else if(cloudStatus.state==='ok') text='Synced'+(cloudStatus.at?' · '+new Date(cloudStatus.at).toLocaleTimeString():'');
  else text='Not yet synced this session.';
  els.forEach(el=>el.textContent=text); }
/* ---- People with access: owner-only. The owner's own bootstrap secret (the wrangler
   SYNC_PASSWORD) never appears here — it isn't part of this list, it's what makes you
   the owner in the first place. Every entry below is an editor or viewer, added and
   removed freely without touching anyone else's code. ---- */
let _peopleList=[];
let _peopleListPristine=null; /* snapshot taken when the list is fetched, restored on Cancel */
let _selectedPerson=null; /* null = nothing chosen, 'new' = adding someone, or an index into _peopleList */
const ACCESS_WORDS=['oak','ridge','creek','hollow','meadow','grove','bramble','willow','fern','stone','maple','thicket','sparrow','otter','bracken','heron','alder','vale'];
function genAccessCode(){ const w=()=>ACCESS_WORDS[Math.floor(Math.random()*ACCESS_WORDS.length)]; return w()+'-'+w()+'-'+Math.floor(10+Math.random()*90); }
async function fetchUsers(){ if(!cloudConfigured()||cloudIdentity.role!=='owner') return null;
  try{ const r=await fetch(CLOUD_SYNC_BASE+'/users',{headers:{'Authorization':'Bearer '+accessCode()}}); if(!r.ok) return null; return await r.json(); }

async function saveUsers(list){

function speciesAdminHtml(){
  let html=`<h2>Species library</h2>
    <p class="small mute">Harvests what it can from a Cal Flora Nursery plant page and leaves the rest for you to fill in. Added species go into the shared library — visible to everyone with access, not just this design.</p>
    <div class="row"><input type="text" id="harvestUrl" class="grow" placeholder="https://www.calfloranursery.com/plants/...">
      <button class="small" onclick="harvestSpecies()">Harvest</button></div>
    <p class="small mute" id="harvestStatus"></p>
    <p class="small mute" style="margin-top:10px">For a page the Worker can't fetch itself (Calscape, Calflora's Plant Characteristics — both JavaScript-rendered, so a server-side fetch just gets an empty shell): open it yourself and run <code>copy(document.body.innerText)</code> in the browser console — that puts the page's rendered text straight on your clipboard — then paste it below. Or paste a JSON object with the same field names as this form (<code>common</code>, <code>sci</code>, <code>moisture</code>, <code>root</code>, <code>goals</code>, etc., <code>null</code> for anything unknown) and it loads straight in, no pattern-matching involved — or a JSON <b>array</b> of several such objects, applied all at once with no review step (safe for updates to species already in the library; any brand-new species in the batch get added unreviewed, flagged in the status line afterward).</p>
    <textarea id="harvestPaste" rows="4" style="width:100%;font-family:monospace;font-size:11px" placeholder="Paste copied page text, or a species JSON object, here"></textarea>
    <div class="row" style="margin-top:6px"><button class="small" onclick="extractFromPaste()">Extract from pasted HTML</button>
      <button class="small" onclick="startBlankDraft()">Or start blank</button></div>`;
  if(_harvestDraft) html+=speciesDraftFormHtml(_harvestDraft);
  return html; }
function speciesDraftFormHtml(d){
  const selOpt=(val,opts,labels)=>`<option value="">—</option>`+opts.map(o=>`<option value="${o}"${val===o?' selected':''}>${esc((labels&&labels[o])||o)}</option>`).join('');
  return `<div class="card" style="margin-top:10px">
    ${d.matchedId?`<h3>Matches an existing entry — filling gaps, not replacing it</h3><p class="small mute">This looks like <b>${esc(d.common)}</b>, already in the library (<code>${esc(d.matchedId)}</code>). Anything it already had stays as-is; only fields it was missing get filled in from this source, and the reference notes get appended.</p>`:`<h3>Draft — review before saving</h3>`}
    ${d.source?`<p class="small mute">Source: <a href="${esc(d.source)}" target="_blank" rel="noopener">${esc(d.source)}</a></p>`:''}
    <label>Id (short, unique, used internally)</label><input type="text" value="${esc(d.id)}" onchange="updateDraftField('id',this.value)"${d.matchedId?' disabled':''}>
    <label>Common name</label><input type="text" value="${esc(d.common)}" onchange="updateDraftField('common',this.value)">
    <label>Scientific name</label><input type="text" value="${esc(d.sci)}" onchange="updateDraftField('sci',this.value)">
    <label>Color (for map/legend)</label><input type="color" value="${esc(d.color||'#7C8D6B')}" onchange="updateDraftField('color',this.value)">
    <h3>Size &amp; site</h3>
    <label>Mature height, ft</label><input type="number" value="${d.ht!=null?d.ht:''}" onchange="updateDraftField('ht',+this.value)">
    <label>Mature radius, ft</label><input type="number" value="${d.rad!=null?d.rad:''}" onchange="updateDraftField('rad',+this.value)">
    <label>Years to target size (T)</label><input type="number" value="${d.T!=null?d.T:''}" onchange="updateDraftField('T',+this.value)">
    <label>Sun</label><select onchange="updateDraftField('sun',this.value)">${selOpt(d.sun,['any','shade','hot'],{hot:'full'})}</select>
    <label>Moisture</label><select onchange="updateDraftField('moisture',this.value)">${selOpt(d.moisture,['dry','moderate','wet'])}</select>
    <label>Drainage</label><select onchange="updateDraftField('drainage',this.value)">${selOpt(d.drainage,['sharp','any','tolerant'])}</select>
    <label>Bloom months (comma-separated, e.g. 3,4,5)</label><input type="text" value="${d.bloom?d.bloom.join(','):''}" onchange="updateDraftField('bloom',this.value.split(',').map(x=>+x.trim()).filter(Boolean))">
    <h3>Layer &amp; structure</h3>
    <label>Story (canopy layer)</label><select onchange="updateDraftField('story',this.value)">${selOpt(d.story,['over','mid','ground','nurse','vine'])}</select>
    <label>Shade cast</label><select onchange="updateDraftField('cast',this.value)">${selOpt(d.cast,['dense','light','open'])}</select>
    <label>Tolerance</label><select onchange="updateDraftField('tol',this.value)">${selOpt(d.tol,['sun','part','shade'])}</select>
    <label><input type="checkbox" ${d.spreads?'checked':''} onchange="updateDraftField('spreads',this.checked)"> Spreads (rhizomatous — can colonize beyond its own footprint)</label>
    <h3>Roots</h3>
    <label>Root class</label><select onchange="updateDraftField('root.cls',this.value)">${selOpt(d.root.cls,['tap','fibrous','mid'])}</select>
    <label>Root depth, ft</label><input type="number" value="${d.root.depth!=null?d.root.depth:''}" onchange="updateDraftField('root.depth',+this.value)">
    <label>Lateral spread ratio</label><input type="number" step="0.1" value="${d.root.lat!=null?d.root.lat:''}" onchange="updateDraftField('root.lat',+this.value)">
    <h3>Irrigation</h3>
    <label>Regime</label><select onchange="updateDraftField('regime',this.value)">${selOpt(d.regime,['wean','reduce','perm'])}</select>
    <label>Drip rate, gph</label><input type="number" step="0.1" value="${d.gph!=null?d.gph:''}" onchange="updateDraftField('gph',+this.value)">
    <label>Emitters</label><input type="number" value="${d.emitters!=null?d.emitters:''}" onchange="updateDraftField('emitters',+this.value)">
    <label><input type="checkbox" ${d.basket?'checked':''} onchange="updateDraftField('basket',this.checked)"> Needs a basket/berm at planting</label>
    <label>Riparian buffer, ft (creek-adjacent only)</label><input type="number" value="${d.riparianFt!=null?d.riparianFt:''}" onchange="updateDraftField('riparianFt',+this.value)">
    <label>Spacing, ft</label><input type="number" value="${d.spacingFt!=null?d.spacingFt:''}" onchange="updateDraftField('spacingFt',+this.value)">
    <h3>Risk &amp; guidance <span class="mute" style="font-size:12px;font-weight:400">— hardest to source, most worth getting right</span></h3>
    <label>Expected loss by yr 3, %</label><input type="number" value="${d.risk!=null?d.risk:''}" onchange="updateDraftField('risk',+this.value)">
    <label>Allelopathy score (0 = none)</label><input type="number" value="${d.allelo!=null?d.allelo:0}" onchange="updateDraftField('allelo',+this.value)">
    <label>Replace with (species id, if it fails)</label><input type="text" value="${esc(d.replace||'')}" onchange="updateDraftField('replace',this.value||null)">
    <label>Failure mode</label><input type="text" value="${esc(d.fail||'')}" onchange="updateDraftField('fail',this.value)">
    <label>Trigger to watch for</label><input type="text" value="${esc(d.trigger||'')}" onchange="updateDraftField('trigger',this.value)">
    <label>Notes</label><input type="text" value="${esc(d.notes||'')}" onchange="updateDraftField('notes',this.value)">
    <h3>Goals (0–3 each)</h3>
    <div class="row" style="flex-wrap:wrap">${Object.keys(GOALS).filter(g=>g!=='local').map(g=>`<div style="width:48%"><label style="margin:0">${esc(GOALS[g])}</label><input type="number" min="0" max="3" style="width:48px" value="${d.goals[g]||0}" onchange="updateDraftGoal('${g}',this.value)"></div>`).join('')}</div>
    <div class="row" style="margin-top:10px"><button class="small primary" onclick="saveDraftSpecies()">${d.matchedId?'Update in library':'Add to library'}</button><button class="small danger" onclick="discardDraftSpecies()">Discard</button></div>
  </div>`; }

function renderBuild(){ const h=curHedge(); if(!h){ setHtml('tab-build',`<p class="small mute">Select a hedgerow.</p>`); return; }
  const st=hedgeStats(h); if(!st.n){ setHtml('tab-build',`<p class="small mute">Nothing planted yet. `+bigBtn('populate','Auto-fill','',"doPopulate()",'primary')+`</p>`); return; }
  let html=`<h2>${esc(h.name)}</h2><p class="small">${st.n} plants · ${st.gpm.toFixed(2)} gpm · ${Math.round(st.tubingFt)} ft of row</p>`;
  html+=`<div class="hz">`+HORIZONS.map(y=>`<button class="${bvYear===y?'on':''}" onclick="bvYear=${y};renderBuild()">Yr ${y}</button>`).join('')+`</div>`;
  html+=`<div class="bvwrap">${bvSvg(h,bvYear)}</div>`;
  html+=`<div class="row"><button class="small" onclick="bvPlayToggle()">${bvPlaying?'Pause':'▶ Play growth'}</button></div>`;
  const A=assess(h,bvYear); const bad=A.notes.flat().filter(n=>n.lvl==='bad'); const warn=A.notes.flat().filter(n=>n.lvl==='warn');
  html+=`<h3>At year ${bvYear}</h3>`;
  if(!bad.length&&!warn.length) html+=`<div class="issue good">No conflicts flagged.</div>`;
  else { const seen=new Set(); [...bad,...warn].forEach(n=>{ if(seen.has(n.t)) return; seen.add(n.t); html+=`<div class="issue ${n.lvl}">${esc(n.t)}</div>`; }); }
  html+=`<h3>Diversity check</h3>`+diversityHtml(h);
  html+=`<h3>Bloom calendar</h3>`+bvCalendar(h);
  html+=`<h3>Planting order</h3><table><tr><th>#</th><th>Plant</th><th>Row</th><th class="num">ft</th><th class="num">risk</th></tr>`
    +plantingOrder(h).slice(0,40).map((x,k)=>`<tr><td>${k+1}</td><td>${esc(x.p.sp.common)}</td><td>${esc(x.p.r.name)}</td><td class="num">${x.p.ft}</td><td class="num">${x.risk}%</td></tr>`).join('')+`</table>`;
  html+=`<div class="row"><button class="small" onclick="showTab('day')">Plan planting day →</button></div>`;
  setHtml('tab-build',html); }
function bvQuick(y){ bvYear=y; renderBuild(); }
function bvPlayToggle(){ bvPlaying=!bvPlaying; if(bvPlaying){ let idx=HORIZONS.indexOf(bvYear); if(idx<0) idx=0; bvTimer=setInterval(()=>{ idx=(idx+1)%HORIZONS.length; bvYear=HORIZONS[idx]; renderBuild(); },1400); } else clearInterval(bvTimer); renderBuild(); }

/* ---- Container sizes ----
   A plant's container matters for survival as well as cost: a big pot is far likelier to get a plant through its
   first year than a small start. So each hedgerow records, per species, the container it will be planted in
   (h.sizes), chosen on the Cost tab from what the nursery actually sells plus the standard sizes (priced as
   estimates, so a size can be planned even when none is in stock). The choice carries through to the price, the
   stock check, the pot volume that sizes a truck load, and the expected loss.
   The nursery's own container table (calfloranursery.com/about-us#containers) gives each pot's real volume: RP 0.06
   gal, 5 in sleeve 0.12, 4 in 0.2, STP 0.43, "1 gallon" 0.6, TTP 0.8, 2 gallon 1.63, "5 gallon" 3.26. Its gallon
   names are well under nominal. `vol` is that actual volume.
   `cuft` is the room a potted plant takes on a truck: the pot's bounding box (diameter squared x height, from the
   same table) scaled so the 1 gallon keeps its earlier 0.3 (which allowed for foliage above the pot); 5g keeps its
   earlier figure.
   `generic` is a price estimate for a size the nursery is not listing, set from its own September 2026 prices (4in
   about $7, 1g $13 to 15.50, 5g $36 to 44). Sizes with no observed price get no generic price and are offered only
   when the nursery lists them.
   There is no 15 gallon: the nursery's table has none, and larger pots are left out for now. A size the app has no
   entry for (one the nursery lists in an inventory, say) is still shown, with its own price, a neutral loss factor
   of 1, and truck room estimated from its nominal gallons.
   `loss` scales a species' own "expected loss by year 3", with 1 gallon as the baseline of 1.0. THOSE FACTORS ARE
   ASSUMPTIONS, NOT MEASURED DATA: 4in 1.5, 1g 1.0 and 5g 0.75 are my own starting points, and the sizes between them
   are interpolated on the log of the pot's actual volume. They are editable on the Cost tab and kept with the ranch
   (R().lossMult). */

/* ---- Watershed Nursery Cooperative (Richmond) as a second place to buy from ----
   The inventory is the table on watershednursery.com/one-page-inventory-list ("Inventory Updated 10/30/2026"; the nursery updates it on
   the 1st of each month). WS_RAW is a snapshot of it, one line per species and container: scientific name | common name | life form |
   container | quantity | price | notes (the source-county column is dropped, and rows for the same species, container and price are
   added together). A newer list pasted in on the Cost tab ("Update Watershed list") is kept with the ranch and replaces the snapshot.
   A species is matched to the library by scientific name, never stored on the species itself, except for species added from this list,
   which carry wsTaxon. Which nursery a species is bought from is a ranch-wide choice per species (R().buyFrom): Cal Flora Nursery
   unless it has no Cal Flora prices and Watershed lists it.
   Container codes: "o" after the size means older, more established plants, an "S" before it a sale price, so D-40S-o is the sale
   price for an older D-40. A sale price is its own size option (marked "sale") because it has its own price and its own stock.
   Every size here comes from the dimensions the nursery gave: TB2 2.38 in sq x 5 in, TB4 4 in sq x 10 in, TP4 4 in sq x 14 in, D-16 2 in dia
   x 7 in, D-40 2.5 in dia x 10 in, Stub 1.5 in dia x 5.5 in, SC 1.5 in dia x 8.25 in. Volume is the box or cylinder less 15% for taper (my
   assumption), and truck room is the box scaled as for the other pots. The loss factors are interpolated on volume like the others. They
   only affect how many plants fit in a load and the expected-loss factor, never a price. Correct them in WS_SIZES if you know them. */

async function updateHedgeFromNursery(){ const h=curHedge(); if(!h) return;
  if(_shopUpd&&_shopUpd.running){ _shopUpd.cancel=true; return; }
  const ids=catalog(h).map(c=>c.sp.id).filter(id=>buyFromOf(SP(id))==='cfn'), run={running:true,cancel:false}; _shopUpd=run; const say=t=>{ const el=document.getElementById('shopStatus'); if(el) el.textContent=t; };
  const btn=document.getElementById('shopUpd'); if(btn) btn.textContent='Stop updating'; const results=[]; let missing=0,failed=0,streak=0; const rpt={h:h.id,updated:[],current:[],missing:[],failed:[]};
  try{ say('Loading the nursery catalog…'); await loadCatalog(false);
    for(let i=0;i<ids.length&&!run.cancel;i++){ const sp=SP(ids[i]); if(!sp) continue; say('Updating '+(i+1)+' of '+ids.length+': '+sp.common+'…'); let requested=false;

      catch(e){ if(e&&e.notFound){ missing++; rpt.missing.push(sp.id); } else{ failed++; rpt.failed.push(sp.id); requested=true; if(++streak>=3) run.cancel=true; } }
      if(requested&&!run.cancel&&i<ids.length-1) await cfnSleep(CFN_DELAY_MS); }
  }catch(e){ run.running=false; if(btn) btn.textContent='Update these species from nursery'; say('Could not load the nursery catalog: '+((e&&e.message)||e)); return; }
  run.running=false;
  if(results.length){ commit('Update '+results.length+' species from the nursery',()=>{ results.forEach(({id,r})=>{ const k=S.species.findIndex(x=>x.id===id); if(k>=0) S.species[k]=r.merged; }); }); pushSharedSpecies(); drawAll(); }
  const changed=results.filter(x=>x.r.changed.length).length; results.forEach(x=>{ if(x.r.changed.length) rpt.updated.push({id:x.id,what:x.r.changed.slice(0,4).join(', ')+(x.r.changed.length>4?', …':'')}); else rpt.current.push(x.id); }); _shopRep=rpt; renderShop();
  const el=document.getElementById('shopStatus'); if(el) el.textContent=(run.cancel?'Stopped. ':'')+'Updated '+changed+' of '+ids.length+' species ('+(results.length-changed)+' already current, '+missing+' not at the nursery'+(failed?', '+failed+' failed':'')+').'; }
function excludeFromCost(id){ if(!planExcluded().includes(id)) toggleExcluded(id); renderShop(); }
/* Replaces one species with another in every row of the hedgerow, plant for plant and in place (same positions), so nothing else
   moves and one undo reverses it. Candidates are the same layer, not excluded, not already in the hedgerow, and offered with those
   the nursery carries first, then by how well they fit the rows the species is in. */
/* Replacement candidates for a species in this hedgerow. "left" is the stock after what the other hedgerows already plant of it;
   "enough" means that covers what this hedgerow needs. Same-species selections (groupMates) come first among the enough ones. */
/* Take a few plants of a species out, evenly along the hedgerow (the rows it is in, in order), when stock covers most but not all of what the plan needs.
   Returns how many were removed. Plants you placed by hand are not special-cased here; this runs inside Auto-fill and density changes only. */
function trimSpecies(h,spId,n){ const all=[]; h.rows.forEach((r,i)=>r.plants.forEach(p=>{ if(p.sp===spId) all.push({r,p}); })); if(!all.length||n<=0) return 0; n=Math.min(n,all.length); const drop=new Set(); for(let q=0;q<n;q++) drop.add(all[Math.min(all.length-1,Math.floor((q+0.5)*all.length/n))]);
  h.rows.forEach(r=>{ r.plants=r.plants.filter(p=>![...drop].some(d=>d.p===p)); }); return n; }
function swapCandidates(h,spId){ const sp=SP(spId); if(!sp) return []; const rowsWith=h.rows.map((r,i)=>i).filter(i=>h.rows[i].plants.some(p=>p.sp===spId)); if(!rowsWith.length) return [];
  const need=h.rows.reduce((a,r)=>a+r.plants.filter(p=>p.sp===spId).length,0); const ex=new Set(planExcluded(h)), have=new Set(); h.rows.forEach(r=>r.plants.forEach(p=>have.add(p.sp))); const moist=rowMoistures(h), gone=new Set((_shopRep&&_shopRep.h===h.id)?_shopRep.missing:[]), use=ranchUseMap(h.id), gk=groupKey(sp);

    .sort((a,b)=>(b.enough-a.enough)||(b.mate-a.mate)||(b.at-a.at)||(b.score-a.score)).slice(0,10); }
/* Does the swap itself, in place, on a hedgerow object (callers wrap it in commit() or are already inside Auto-fill). Returns how many plants changed. */
function swapApply(hh,spId,pick,why){ const sp=SP(spId), to=SP(pick); let n=0; if(!sp||!to) return 0;

  hh.autoLog=(hh.autoLog||[]).concat('Manual change: swapped '+sp.common+' for '+to.common+' in every row ('+n+' plants), because '+(why||'the nursery does not list '+sp.common)+'.'); return n; }
function quickSwap(spId,toId){ const h=curHedge(), sp=SP(spId), to=SP(toId); if(!h||!sp||!to) return; commit('Swap '+sp.common+' for '+to.common+' in '+h.name,()=>{ const hh=R().hedgerows.find(x=>x.id===h.id); swapApply(hh,spId,toId,'it is short of stock across the ranch'); }); drawAll(); renderPanels(); renderShop(); }
async function swapSpeciesEverywhere(spId){ const h=curHedge(), sp=SP(spId); if(!h||!sp) return;

    +cands.map(c=>`<div class="sp" onclick="UI.close('${c.sp.id}')"><span class="swatch" style="background:${c.sp.color}"></span><span class="n">${esc(c.sp.common)}<i>${esc(bloomStr(c.sp))} · ${esc(c.sp.moisture||'')} · ${c.at?'at the nursery'+(c.np?' $'+fmtMoney(c.np.unit):'')+(c.stock!=null?(c.left>=need?' · '+c.stock+' in stock'+(c.use?' ('+c.left+' left after other hedgerows)':''):' · only '+Math.max(0,c.left)+' left'+(c.use?' after other hedgerows':'')):''):'no nursery price'}${c.mate?' · same species':''}</i></span><span class="fit ${c.fit>=0.7?'ok':c.fit<0.45?'alert':''}">${Math.round(c.fit*100)}%</span></div>`).join('');

function normalizeState(){ if(!S.species) S.species=JSON.parse(JSON.stringify(SPECIES_DEFAULT));

       place but are no longer read. Hedgerows created afterwards get their own at creation
       and are never touched here. */
    r.hedgerows.forEach(h=>{ h.rows.forEach(rr=>{ rr.plants=rr.plants||[]; });
      if(h.goals===undefined) h.goals=JSON.parse(JSON.stringify(r.goals||{}));
      if(h.excluded===undefined) h.excluded=((r.plan&&r.plan.excluded)||[]).slice(); }); });
  if(!S.sel) S.sel={hedge:null,row:null,species:null,wnode:null,wline:null}; }
/* ---- Hedgerow navigator ----
   The subtitle under the app name names the ranch and the hedgerow you're working on,
   and opens a menu to jump to any hedgerow (selecting it and fitting the map to it) or
   back out to the whole ranch. Navigation only: it deliberately does not call
   openHedge(), which is for a freshly drawn hedgerow — it reads site data and offers to
   auto-fill, neither of which belongs on a menu click. It stays on whatever tab you're
   on, since the per-hedgerow tabs (Explore, Rows, Plants) now simply show the new one.
   Rendered from renderPanels() as well as renderRanch(): the subtitle used to be
   written only by renderRanch(), so it went stale on every other tab. */
let _hedgeMenuOpen=false;
function sortedHedges(){ return R().hedgerows.slice().sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),undefined,{numeric:true,sensitivity:'base'})); }
function renderRanchSub(){ const el=document.getElementById('ranchSub'); if(!el||!S||!S.ranches) return;
  const r=R(), n=r.hedgerows.length, cur=curHedge();
  if(!n){ el.textContent=r.name+' · no hedgerows yet'; return; }
  /* The ranch name is plain text; the hedgerow is a native select, labeled, so it reads as the thing every tab below is about. "Whole ranch" zooms out. */
  const opts=sortedHedges().map(h=>{ const plants=h.rows.reduce((a,rr)=>a+rr.plants.length,0); return `<option value="${h.id}"${cur&&h.id===cur.id?' selected':''}>${esc(h.name)} · ${Math.round(pathLenFt(h.centerline))} ft · ${plants} plant${plants===1?'':'s'}</option>`; }).join('');
  el.innerHTML=`<div>${esc(r.name)}</div><label class="hedgeSel"><span>Hedgerow:</span><select id="hedgeSelect" title="Choose the hedgerow every tab below is about. [ and ] step through them." onchange="hedgeSelChange(this.value)">${cur?'':'<option value="" selected disabled>Choose a hedgerow…</option>'}${opts}<option disabled>──────────</option><option value="__ranch">Whole ranch (zoom out)</option></select></label>`;
  /* Set the value in code as well as with "selected": a browser that restores form state on reload can override the attribute and show another hedgerow. */
  const sel=document.getElementById('hedgeSelect'); if(sel){ sel.setAttribute('autocomplete','off'); sel.value=cur?cur.id:''; } }
function hedgeSelChange(v){ if(v==='__ranch'){ gotoWholeRanch(); const sel=document.getElementById('hedgeSelect'); if(sel&&curHedge()) sel.value=curHedge().id; } else gotoHedge(v); }
function toggleHedgeMenu(e){ if(e) e.stopPropagation(); _hedgeMenuOpen=!_hedgeMenuOpen; renderRanchSub(); }
function closeHedgeMenu(){ if(!_hedgeMenuOpen) return; _hedgeMenuOpen=false; renderRanchSub(); }
function gotoHedge(id){ const h=R().hedgerows.find(x=>x.id===id); if(!h) return;
  _hedgeMenuOpen=false; S.sel.hedge=id; S.sel.row=0; S.sel.plant=null;
  /* switching hedgerows pans to it and keeps the zoom you have set; the explicit "zoom to" buttons still fit it to the screen */
  if(map&&h.centerline&&h.centerline.length) map.panTo(L.latLngBounds(h.centerline).getCenter()); drawAll(); renderPanels(); }
function gotoWholeRanch(){ _hedgeMenuOpen=false; renderRanchSub(); fitAllView(); }
function cycleHedge(dir){ const hs=sortedHedges(); if(!hs.length) return; const i=hs.findIndex(x=>x.id===S.sel.hedge);
  gotoHedge(hs[i<0?(dir>0?0:hs.length-1):(i+dir+hs.length)%hs.length].id); }
document.addEventListener('click',e=>{ if(_hedgeMenuOpen){ const w=document.getElementById('hedgeNavWrap'); if(!w||!w.contains(e.target)) closeHedgeMenu(); } });
/* The acre dock outlines the species planted in the selected row (.dockSp.in), so it has
   to follow the same changes the panels do — auto-fill, paint, erase, swap, remove,
   undo, or switching row/hedgerow. It was only ever redrawn on hover/pin/toggle, so it
   kept showing the row as it was before. renderDock() returns immediately when the dock
   isn't open, so this costs nothing in the common case. */
function renderPanels(){ renderRanchSub(); const t=currentTab(); renderTabIfNeeded(t); renderStageHint(t); updateHistButtons(); saveBadge(); netBadge(); try{ renderDock(); }catch(e){ console.error('renderDock failed:',e); }
}
let curSave=null;
function saveIndexKey(){ return 'hedgeright.saves.index'; }
function saveIndex(){ try{ return JSON.parse(localStorage.getItem(saveIndexKey())||'[]'); }catch(e){ return []; } }
function putIndex(idx){ try{ localStorage.setItem(saveIndexKey(),JSON.stringify(idx)); }catch(e){} }
function designSummary(){ const rs=S.ranches.length; const hs=S.ranches.reduce((a,r)=>a+r.hedgerows.length,0); return rs+' ranch'+(rs===1?'':'es')+', '+hs+' hedgerow'+(hs===1?'':'s'); }
async function saveAs(name){ try{ localStorage.setItem('hedgeright.save.'+name,JSON.stringify(S)); const idx=saveIndex(); const ex=idx.find(x=>x.name===name);
    if(ex) ex.at=Date.now(); else idx.push({name,at:Date.now()}); putIndex(idx); curSave={id:name,name}; markDirty(false); UI.toast('Saved as "'+name+'"'); }
  catch(e){ UI.alert('Could not save: '+(e.message||e)); } }
async function openSave(name){ try{ const txt=localStorage.getItem('hedgeright.save.'+name); if(!txt) throw new Error('not found');
    S=JSON.parse(txt); normalizeState(); curSave={id:name,name}; hideStart(); if(map){ map.setView(R().center,R().zoom); drawAll(); } renderPanels(); }
  catch(e){ UI.alert('Could not open "'+name+'": '+(e.message||e)); } }
function deleteSave(name){ localStorage.removeItem('hedgeright.save.'+name); putIndex(saveIndex().filter(x=>x.name!==name)); if(curSave&&curSave.name===name) curSave=null; refreshRanchesSavesView(); }
function saveNow(){ if(curSave) saveAs(curSave.name); else promptSaveAs(); }
async function promptSaveAs(){ const name=await UI.prompt('Name this design',curSave?curSave.name:R().name,{title:'Save as'}); if(name) saveAs(name); }
function snapListKey(){ return 'hedgeright.snaps.'+(curSave?curSave.name:'unsaved'); }
function snapList(){ try{ return JSON.parse(localStorage.getItem(snapListKey())||'[]'); }catch(e){ return []; } }
function snapPut(list){ try{ localStorage.setItem(snapListKey(),JSON.stringify(list)); }catch(e){} }
function snapTake(label){ const list=snapList(); list.push({id:uid(),label:label||new Date().toLocaleString(),at:Date.now(),data:JSON.stringify(S)}); if(list.length>20) list.shift(); snapPut(list); UI.toast('Snapshot taken'); }
function snapRestore(id){ const s=snapList().find(x=>x.id===id); if(!s) return; commit('Restore snapshot',()=>{ S=JSON.parse(s.data); normalizeState(); }); if(map) drawAll(); renderPanels(); }
function snapDelete(id){ snapPut(snapList().filter(x=>x.id!==id)); }
function saveState(){ return localStorage.getItem('hedgeright.dirty')==='1'?'dirty':'ok'; }
let _dirty=false;
let autoSaveOn=true;
function loadAutoSavePref(){ try{ const v=localStorage.getItem('hedgeright.autoSave'); autoSaveOn=v===null?true:v==='1'; }catch(e){ autoSaveOn=true; } }
function setAutoSave(on){ autoSaveOn=on; try{ localStorage.setItem('hedgeright.autoSave',on?'1':'0'); }catch(e){} saveBadge(); if(on&&_dirty) persistNow(); }
function markDirty(v){ _dirty=v===undefined?true:v; saveBadge(); }
function saveBadge(){ const box=document.getElementById('autoSaveBox'); if(box) box.checked=autoSaveOn;
  const btn=document.getElementById('saveBtn'); if(btn){ btn.style.display=autoSaveOn?'none':''; btn.disabled=!_dirty;
    btn.classList.toggle('dirty',_dirty); btn.title=_dirty?'Unsaved changes — click to save (Ctrl+S)':'Nothing to save'; } }
/* What "save" actually does: write the unnamed autosave copy, push to the cloud if
   configured, and update the named save slot too if this design has one. Runs either
   on the auto-save debounce or from a manual click — same work either way. */
function persistNow(){ try{ localStorage.setItem('hedgeright.autosave',JSON.stringify(S)); }catch(e){}
  if(curSave) saveAs(curSave.name); else markDirty(false);
  cloudPush(); }
function manualSaveClick(){ clearTimeout(_saveT); persistNow(); }
let _saveT=null;
function saveSoon(){ markDirty(true); if(!autoSaveOn) return; clearTimeout(_saveT); _saveT=setTimeout(persistNow,1200); }
function toggleSaveMenu(e){ if(e) e.stopPropagation(); const w=document.getElementById('saveWrap'); w.classList.toggle('open');
  document.getElementById('saveMenuHolder').innerHTML=w.classList.contains('open')?`<div class="menu">
    <button onclick="promptSaveAs();toggleSaveMenu()">Save As… <kbd>Ctrl+S</kbd></button>
    <button onclick="toggleSaveMenu();openRanchesSavesDialog(false)">Open a Saved Design…</button>
    <button onclick="snapTake();toggleSaveMenu()">Take a Snapshot</button>
    <div class="sep"></div>
    <button onclick="exportJSON();toggleSaveMenu()">Export JSON</button>
    <button onclick="document.getElementById('impInput').click();toggleSaveMenu()">Import JSON…</button>
  </div>`:''; }
document.addEventListener('click',e=>{ const w=document.getElementById('saveWrap'); if(w&&w.classList.contains('open')&&!w.contains(e.target)) w.classList.remove('open'); });
function savesHtml(){ const idx=saveIndex().sort((a,b)=>b.at-a.at);
  if(!idx.length) return `<p class="small mute">Nothing saved yet.</p>`;
  return `<div class="slist">`+idx.map(s=>`<div class="srow" onclick="openSave('${esc(s.name)}')"><span class="grow">${esc(s.name)}</span><span class="small mute">${new Date(s.at).toLocaleDateString()}</span>
    <button class="small danger" onclick="event.stopPropagation();deleteSave('${esc(s.name)}')">Delete</button></div>`).join('')+`</div>`; }
function showStart(){ const d=document.getElementById('dlg'); if(d&&d.classList.contains('show')) UI.close(null); document.getElementById('start').classList.add('show'); renderStart(); }
function hideStart(){ document.getElementById('start').classList.remove('show'); const d=document.getElementById('dlg'); if(d&&d.classList.contains('show')) UI.close(null); }
/* Same picker as renderStart()/#start, but as a modal over the map instead of a full-screen
   takeover — used when opened from Settings or the save menu. Shares the same action handlers
   (startNew, hideStart, openSave, savesHtml) since hideStart() now closes this dialog too. */
function renderRanchesSavesBody(){
  return `<div class="scards">
    <div class="scard" onclick="startNew()"><h3>New design</h3><p class="small mute">Start from a map location.</p></div>
    <div class="scard" onclick="hideStart()"><h3>Continue</h3><p class="small mute">${esc(designSummary())}</p></div>
  </div>
  <h2>Saved designs</h2>${savesHtml()}
  <input type="file" id="impInputDlg" accept=".json,.hedgeright.json" style="display:none" onchange="if(this.files[0]){ importJSON(this.files[0]); }">
  <div class="row" style="margin-top:10px"><button class="small" onclick="document.getElementById('impInputDlg').click()">Import JSON…</button></div>`; }
function refreshRanchesSavesView(){ const d=document.getElementById('dlg'); const t=document.getElementById('dlgT');
  if(d&&d.classList.contains('show')&&t&&t.textContent==='Ranches & saves'){ const b=document.getElementById('dlgB'); if(b) b.innerHTML=renderRanchesSavesBody(); }
  else renderStart(); }
function openRanchesSavesDialog(returnToSettings){
  const actions=returnToSettings?[{label:'← Settings',value:'back'},{label:'Close',primary:true,value:null}]:[{label:'Close',primary:true,value:null}];
  UI.open('Ranches & saves',renderRanchesSavesBody(),actions).then(v=>{ if(v==='back') openSettingsDialog(); }); }
function renderStart(){ const html=`<div class="stitle"><h1>HedgeRight</h1></div>
  <p class="mute">California native hedgerows, planned by goal and grown on paper first.</p>
  <div class="scards">
    <div class="scard" onclick="startNew()"><h3>New design</h3><p class="small mute">Start from a map location.</p></div>
    <div class="scard" onclick="hideStart()"><h3>Continue</h3><p class="small mute">${esc(designSummary())}</p></div>
  </div>
  <h2>Saved designs</h2>${savesHtml()}
  <input type="file" id="impInput" accept=".json,.hedgeright.json" style="display:none" onchange="if(this.files[0]) importJSON(this.files[0])">
  <div class="row" style="margin-top:10px"><button class="small" onclick="document.getElementById('impInput').click()">Import JSON…</button></div>`;
  setHtml('startBody',html); }
function startNew(){ const r=blankRanch('New ranch',R()?R().center:[38.889326,-123.162412],R()?R().zoom:15); S.ranches.push(r); S.active=r.id; curSave=null;
  hideStart(); if(map){ map.setView(r.center,r.zoom); drawAll(); } renderPanels(); showTab('ranch'); }
function finishWizard(){ hideStart(); }
/* First-run gate: if cloud sync is set up for this deployment but this device has
   never been given an access code, don't show ANYTHING about the ranch — no name, no
   location, no map — until someone proves they belong here. Skipped entirely if this
   build has no Worker configured (CLOUD_SYNC_BASE still the placeholder), so the app
   still works standalone for anyone who forks it without wiring up cloud sync. */
function renderSignIn(msg){
  document.getElementById('start').classList.add('show');
  setHtml('startBody',`<div class="stitle"><h1>HedgeRight</h1></div>
    <p class="mute">Sign in to sync with the shared ranch design.</p>
    ${msg?`<p class="small alert">${esc(msg)}</p>`:''}
    <form onsubmit="event.preventDefault();trySignIn();">
      <label>Access code</label>
      <input type="password" id="signInCode" name="hedgeright-access-code" autocomplete="current-password" placeholder="your access code">
      <div class="row" style="margin-top:10px"><button type="submit" class="primary">Sign in</button></div>
    </form>
    <p class="small mute" id="signInStatus"></p>`); }
async function trySignIn(){
  const inp=document.getElementById('signInCode'); if(!inp) return;
  const code=inp.value.trim(); if(!code) return;
  const status=document.getElementById('signInStatus'); if(status) status.textContent='Signing in…';
  setAccessCode(code);
  const data=await cloudPull(); await cloudWhoAmI();
  if(!cloudIdentity.role){ setAccessCode(''); if(status) status.textContent="That code wasn't recognized. Check it and try again."; return; }
  const [,sharedSpecies]=await Promise.all([loadMyViews(),loadSharedSpecies()]);
  S=data||defaultState(); normalizeState();
  if(sharedSpecies) S.species=sharedSpecies; markSpeciesSynced();
  hideStart(); finishBoot(); }
function showMapLoadError(){
  document.getElementById('start').classList.add('show');
  setHtml('startBody',`<h1 style="font-size:21px">The map library did not load</h1>
    <p class="small">HedgeRight draws on Leaflet and Esri imagery from the internet. Something blocked that — no connection, a firewall, or a viewer that will not fetch outside files.</p>
    <p class="small">Try reloading. Your saved designs are untouched either way, and JSON import/export still works.</p>
    <div class="row"><button class="small" onclick="location.reload()">Try again</button>
      <button class="small" onclick="document.getElementById('impStart').click()">Import JSON</button>
      <input id="impStart" type="file" accept="application/json" style="display:none" onchange="if(this.files[0]) importJSON(this.files[0])"></div>`); }
function finishBoot(){
  try{ initMap(); }
  catch(e){
    document.getElementById('start').classList.add('show');
    setHtml('startBody',`<h1 style="font-size:21px">The map failed to start</h1><p class="small">${esc(e.message||String(e))}</p>
      <div class="row"><button class="small" onclick="location.reload()">Try again</button></div>`);
    return;
  }
  const lh=document.getElementById('lyHex'); if(lh) lh.checked=false;
  renderPanels();
  showTab('ranch');
  renderCloudStatus();
  window.addEventListener('beforeunload',()=>{ try{ localStorage.setItem('hedgeright.autosave',JSON.stringify(S)); }catch(e){} });
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') checkStale(); }); }
(async function boot(){
  loadAutoSavePref();
  if(typeof L==='undefined'||!L.map){ showMapLoadError(); return; }
  if(cloudDeployed()&&!accessCode()){ renderSignIn(); return; }
  let loaded=false; let sharedSpecies=null;
  if(cloudConfigured()){ const [cloud,,species]=await Promise.all([cloudPull(),loadMyViews(),loadSharedSpecies()]); if(cloud){ S=cloud; loaded=true; } sharedSpecies=species; cloudWhoAmI(); }
  else await loadMyViews();
  if(!loaded){
    try{ const saved=localStorage.getItem('hedgeright.autosave'); S=saved?JSON.parse(saved):defaultState(); }
    catch(e){ S=defaultState(); }
  }
  normalizeState();
  if(sharedSpecies) S.species=sharedSpecies; markSpeciesSynced();
  finishBoot();
})();
</script>
</body>
</html>
