<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>HedgeRight — native hedgerow planner</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{
  --paper:#EEF0E8; --paper2:#E2E6DA; --ink:#1E2A22; --mute:#6F7D72; --line:#C9D0C3;
  --water:#2F6FA3; --water2:#DCE8F3; --alert:#B4471E; --ok:#3D7A4A; --warn:#A67A1B;
  --sel:#1E2A22;
  --panelW:372px; --tapeH:176px;
  font-family:"Atkinson Hyperlegible",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--paper);color:var(--ink);font-family:inherit;font-size:15px;line-height:1.35}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:var(--paper2);border:1px solid var(--line);border-radius:6px;padding:6px 10px}
button:hover{border-color:var(--mute)}
button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
button.small{padding:3px 8px;font-size:13px}
button.danger{color:var(--alert);border-color:var(--alert)}
button.danger:hover{background:#F1D8CC}
/* The one "do this next" signal in the app — ink fill, bold, everywhere it means the
   same thing. Mirrors #stageBar .nxt, which already used this pattern; generalized so
   any button can carry it instead of just the stage bar. */
button.primary{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:700}
button.primary:hover{background:#16201A;border-color:#16201A}
button:disabled{opacity:.42;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--water);outline-offset:1px}
input[type=text],input[type=number],select{background:#fff;border:1px solid var(--line);border-radius:6px;padding:5px 8px;width:100%}
input[type=number]{width:88px}
label{display:block;font-size:13px;color:var(--mute);margin:8px 0 3px}
h1{font-size:19px;margin:0;font-weight:700;letter-spacing:-.01em}
.stitle .hrlogo{width:132px;height:78px}
#panelHead h1{gap:10px}
h2{font-size:15px;margin:16px 0 6px;font-weight:700}
h3{font-size:14px;margin:12px 0 4px;font-weight:700}
p{margin:6px 0}
.mute{color:var(--mute)} .small{font-size:13px}
.ok{color:var(--ok)} .alert{color:var(--alert)} .warn{color:var(--warn)}

#app{display:grid;grid-template-columns:var(--panelW) 1fr;grid-template-rows:1fr;height:100%;overflow:hidden}
#panel{background:var(--paper);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#panelHead{padding:12px 14px 8px;border-bottom:1px solid var(--line)}
#panelHead .sub{font-size:13px;color:var(--mute);margin-top:2px}
#tabs{display:flex;gap:0;border-bottom:1px solid var(--line)}
#tabs button{flex:1;border:0;border-radius:0;background:transparent;padding:9px 2px;font-size:13px;border-bottom:3px solid transparent}
#tabs button.on{background:transparent;color:var(--ink);border-bottom-color:var(--ink)}
#panelBody{overflow:auto;padding:10px 14px 16px;flex:1;min-height:0}
#stageBar{display:flex;gap:8px;align-items:center;padding:8px 12px;border-top:1px solid var(--line);background:var(--paper);
  box-shadow:0 -2px 10px rgba(0,0,0,.06);flex:0 0 auto}
#stageBar .grow{flex:1;min-width:0}
#stageBar .nxt{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:700;white-space:nowrap}
#stageBar .nxt:disabled{opacity:.4}
#stageBar .why{font-size:12px;color:var(--mute);line-height:1.25}
@media (max-width:820px){#stageBar{padding:6px 10px}#stageBar .why{display:none}}
.tab{display:none}.tab.on{display:block}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>*{flex:0 0 auto}
.grow{flex:1 1 auto !important}
.card{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:8px 0;background:#fff}
.card.sel{border-color:var(--ink);box-shadow:inset 3px 0 0 var(--ink)}
.card h3{margin:0 0 4px}
.list .card{cursor:pointer}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:3px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mute);font-weight:400}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}

#mapWrap{position:relative;min-width:0;display:grid;grid-template-rows:1fr auto}
#map{width:100%;height:100%;background:#0f1512}
#modebar{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:900;display:flex;gap:6px;background:rgba(238,240,232,.94);padding:6px;border-radius:10px;border:1px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,.25)}
#modebar button{white-space:nowrap}
#m-finish{background:var(--paper2);color:var(--mute)}
#m-finish.ready{background:var(--ok);color:#fff;border-color:var(--ok);font-weight:700}
#m-finish:disabled{cursor:default;opacity:.75}
#readout{position:absolute;left:10px;bottom:calc(var(--tapeH) + 12px);z-index:800;background:rgba(30,42,34,.92);color:#EEF0E8;padding:6px 10px;border-radius:8px;font-size:13px;max-width:70%;pointer-events:none}
#readout:empty{display:none}
#hexTip{position:absolute;right:10px;top:64px;z-index:700;background:rgba(238,240,232,.96);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;width:250px;display:none;box-shadow:0 2px 8px rgba(0,0,0,.25)}
#hexTip.show{display:block}
#hexTip b{font-weight:700}
#layerBox{position:absolute;right:10px;bottom:calc(var(--tapeH) + 12px);z-index:800;background:rgba(238,240,232,.94);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:13px;display:flex;flex-direction:column;gap:3px}
#layerBox label{margin:0;display:flex;gap:6px;align-items:center;color:var(--ink);cursor:pointer}
#heatLegend:empty{display:none}
#heatLegend{border-top:1px solid var(--line);margin-top:4px;padding-top:5px;font-size:12px;width:200px}

#tape{height:var(--tapeH);z-index:1;position:relative;border-top:1px solid var(--line);background:var(--paper);overflow:hidden;display:flex;flex-direction:column}
#tape.hidden{display:none}
#growDock{position:absolute;left:0;right:0;bottom:calc(var(--tapeH) + 1px);z-index:850;background:rgba(238,240,232,.97);border-top:1px solid var(--line);
  box-shadow:0 -3px 14px rgba(0,0,0,.16);display:none;flex-direction:column;max-height:190px}
#growDock.show{display:flex}
#mapWrap.notape #growDock{bottom:0}
#mapWrap.docked #readout,#mapWrap.docked #layerBox{bottom:calc(var(--tapeH) + 200px)}
#mapWrap.notape.docked #readout,#mapWrap.notape.docked #layerBox{bottom:200px}
.dockHead{display:flex;gap:10px;align-items:center;padding:5px 12px;border-bottom:1px solid var(--line);font-size:13px}
.dockBody{display:flex;gap:14px;padding:8px 12px;overflow:auto}
.dockFacts{flex:0 0 240px;min-width:200px}
.dockCols{display:flex;gap:16px;flex:1;overflow-x:auto}
.dockCol h4{margin:0 0 3px;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);font-weight:400}
.dockCol{min-width:150px}
.dockSp{display:flex;gap:6px;align-items:center;font-size:13px;padding:2px 5px;border-radius:5px;cursor:pointer;border:1px solid transparent;white-space:nowrap}
.dockSp:hover{background:#fff;border-color:var(--line)}
.dockSp.in{background:#fff;border-color:var(--ink)}
.dockSp .n{flex:1}
.dockSp .fit{font-variant-numeric:tabular-nums;font-size:12px;color:var(--mute)}
.dockTab{position:absolute;right:12px;bottom:6px;font-size:12px}
#growDock:not(.show) .dockTab{display:none}
@media (max-width:820px){#growDock{max-height:44vh;bottom:0}.dockBody{flex-direction:column;gap:8px}.dockFacts{flex:none}}
#mapWrap.notape #readout,#mapWrap.notape #layerBox{bottom:12px}
@media (max-width:820px){#mapWrap.notape #readout{bottom:auto;top:8px}#mapWrap.notape #layerBox{bottom:auto;top:44px}}
#tapeHead{display:flex;gap:10px;align-items:center;padding:4px 12px;font-size:13px;color:var(--mute)}
#tapeHead b{color:var(--ink)}
#tapeScroll{flex:1;overflow:auto}
#tapeSvg{display:block}
.tapeDot{cursor:pointer}
.tapeDot:hover{stroke:var(--ink);stroke-width:2}

.swatch{display:inline-block;width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.3);vertical-align:-2px;margin-right:6px}
.sp{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:6px;cursor:pointer;border:1px solid transparent}
.sp:hover{background:#fff}
.sp.on{border-color:var(--ink);background:#fff}
.sp .n{flex:1;min-width:0}
.sp .n i{color:var(--mute);font-size:12px;display:block;font-style:italic}
.bigbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 14px;border-radius:12px;
  border:1px solid var(--line);background:#fff;margin:8px 0;line-height:1.25}
.bigbtn:hover{border-color:var(--ink);box-shadow:0 2px 10px rgba(0,0,0,.08)}
.bigbtn .ic{width:64px;height:44px;flex:0 0 auto}
.bigbtn b{display:block;font-size:15px}
.bigbtn i{display:block;font-style:normal;font-size:13px;color:var(--mute);margin-top:2px}
.bigbtn.primary{background:linear-gradient(180deg,#F3F5EC,#E7EBDD);border:2px solid var(--ink)}
.bigbtn.primary b{color:var(--ink)}
.bigbtn:disabled{opacity:.5;cursor:not-allowed}
.bigrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bigrow .bigbtn{margin:0}
@media (max-width:820px){.bigrow{grid-template-columns:1fr}}
.addbtn{font-size:11px;padding:2px 7px;border-radius:11px;border:1px solid var(--line);background:var(--paper2);color:var(--mute);white-space:nowrap;min-width:62px}
.addbtn:hover{border-color:var(--ink);color:var(--ink)}
.addbtn.in{background:#DCE9DD;border-color:var(--ok);color:var(--ok);font-weight:700}
.mark{font-size:11px;color:var(--mute);white-space:nowrap;min-width:56px;text-align:right}
.sp.on .mark,.dockSp.in .mark{color:var(--ok);font-weight:700}
.sp .fit{width:52px;text-align:right;font-size:12px;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:var(--paper2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.pill{display:inline-block;font-size:12px;padding:1px 7px;border-radius:10px;background:var(--paper2);margin:1px 2px 1px 0}
.pill.w{background:var(--water2);color:var(--water)}
.hint{font-size:13px;color:var(--mute);padding:8px 10px;border:1px dashed var(--line);border-radius:8px;margin:8px 0}
details summary{cursor:pointer;color:var(--mute);font-size:13px}
.leaflet-container{font-family:inherit}
.leaflet-tooltip.rowlab{background:rgba(30,42,34,.9);color:#EEF0E8;border:0;font-size:12px;padding:2px 6px;border-radius:4px;box-shadow:none}
.leaflet-tooltip.rowlab::before{display:none}
.vh{width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.4)}
.wnode{display:flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:var(--water);color:#fff;font-size:12px;font-weight:700;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.5)}
.wnode.sel{background:var(--ink)}
.wnode.tank{border-radius:5px}
.wnode.reg{background:var(--warn)}
.wnode.outlet{background:var(--ok)}
.wnode.pond{background:#4C8FBF;border-radius:40%}

/* dialogs, toasts, network badge, provenance, history */
#dlg{position:fixed;inset:0;z-index:3000;background:rgba(30,42,34,.42);display:none;align-items:center;justify-content:center;padding:20px}
#dlg.show{display:flex}
.dlgbox{background:var(--paper);border:1px solid var(--line);border-radius:12px;max-width:440px;width:100%;padding:16px 18px;box-shadow:0 12px 40px rgba(0,0,0,.35)}
.dlgbox h3{margin:0 0 8px;font-size:17px}
.dlgA{justify-content:flex-end;margin-top:14px;gap:8px}
.dlgA button.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.dlgA button.danger{background:var(--alert);color:#fff;border-color:var(--alert)}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,16px);z-index:3100;background:var(--ink);color:var(--paper);
  border-radius:10px;padding:9px 12px;font-size:13px;display:flex;gap:10px;align-items:center;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;box-shadow:0 6px 24px rgba(0,0,0,.35)}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{background:transparent;color:var(--paper);border:1px solid rgba(238,240,232,.45)}
#netBadge{display:none;font-size:12px;padding:3px 8px;border-radius:9px;margin-left:6px}
#netBadge.show{display:inline-block}
#netBadge.busy{background:var(--water2);color:var(--water)}
#netBadge.bad{background:#F1D8CC;color:var(--alert)}
#fsBadge{display:none;font-size:12px;padding:3px 8px;border-radius:9px;margin-left:6px;cursor:help}
#fsBadge.show{display:inline-block}
#fsBadge.ok{background:#DCE9DD;color:var(--ok)}
#fsBadge.bad{background:#F1D8CC;color:var(--alert)}
#saveWrap{position:relative;display:inline-flex}
#saveBtn{font-size:12px;padding:3px 9px;border-radius:7px 0 0 7px;border-right:0}
#saveBtn.dirty{background:#F6EBD2;border-color:#E4D3A8;color:var(--warn);font-weight:700}
#saveMore{font-size:11px;padding:3px 6px;border-radius:0 7px 7px 0}
#saveWrap .menu{display:none;position:absolute;top:26px;left:0;z-index:1500;background:var(--paper);border:1px solid var(--line);
  border-radius:10px;box-shadow:0 8px 26px rgba(0,0,0,.25);min-width:236px;padding:5px;flex-direction:column}
#saveWrap.open .menu{display:flex}
#saveWrap .menu button{background:transparent;border:0;text-align:left;padding:7px 10px;border-radius:6px;font-size:13px;display:flex;justify-content:space-between;gap:12px}
#saveWrap .menu button:hover{background:var(--paper2)}
#saveWrap .menu kbd{color:var(--mute);font-size:11px}
#saveWrap .menu .sep{height:1px;background:var(--line);margin:4px 6px}
#saveState{font-size:12px;padding:3px 8px;border-radius:9px;margin-left:2px;cursor:pointer;border:1px solid transparent}
#saveState.ok{color:var(--mute)}
#saveState.dirty{background:#F6EBD2;color:var(--warn);border-color:#E4D3A8}
#saveState.writing{color:var(--water)}
#saveState:hover{border-color:var(--line)}
.prov{font-size:10px;text-transform:uppercase;letter-spacing:.03em;border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:5px;color:var(--mute);cursor:help;vertical-align:1px}
#modeBanner{position:absolute;top:56px;left:50%;transform:translateX(-50%);z-index:880;background:var(--ink);color:var(--paper);
  font-size:13px;padding:6px 12px;border-radius:9px;display:none;gap:10px;align-items:center;box-shadow:0 2px 10px rgba(0,0,0,.3);transition:top .15s ease}
#mapWrap.busy-active #modeBanner{top:148px}
@media (max-width:820px){#mapWrap.busy-active #modeBanner{top:auto}}
#modeBanner.show{display:flex}
#modeBanner .cta{background:var(--paper);color:var(--ink);border-radius:6px;padding:3px 8px;animation:hrpulse 1.6s ease-in-out infinite}
@keyframes hrpulse{0%,100%{opacity:.85}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){#modeBanner .cta{animation:none}}
#modeBanner kbd{background:rgba(238,240,232,.16);border-radius:4px;padding:1px 5px;font:inherit}
#histBar{display:flex;gap:6px;align-items:center}
#histBar button:disabled{opacity:.35;cursor:default}
@media (max-width:820px){#modeBanner{top:auto;bottom:74px;left:6px;right:6px;transform:none;justify-content:center;flex-wrap:wrap}}

/* stage rail + resizable inspector */
#tabs{display:flex;gap:0;border-bottom:1px solid var(--line);position:relative}
#tabs button{flex:1;border:0;border-radius:0;background:transparent;padding:9px 2px 8px;font-size:12px;border-bottom:3px solid transparent;color:var(--mute);position:relative}
#tabs button .stepn{display:block;font-size:10px;opacity:.65;letter-spacing:.04em}
#tabs button.on{color:var(--ink);border-bottom-color:var(--ink);font-weight:700}
#tabs button.done{color:var(--ink)}
#tabs button.done .stepn::after{content:" ✓";color:var(--ok)}
#tabs button:disabled{opacity:.42;cursor:not-allowed}
#grip{position:absolute;top:0;bottom:0;right:-3px;width:7px;cursor:col-resize;z-index:1200}
#grip:hover,#grip.drag{background:linear-gradient(90deg,transparent 2px,var(--water) 2px,var(--water) 4px,transparent 4px)}
#panel{position:relative}
#collapse{position:absolute;top:8px;right:10px;z-index:5}
#panel.collapsed{--panelW:0}
@media (max-width:820px){#grip{display:none}}
#panelToggle{display:none}
#start{position:fixed;inset:0;z-index:2000;background:var(--paper);display:none;overflow:auto;padding:28px 16px 40px}
#start.show{display:block}
#startInner{max-width:620px;margin:0 auto}
.stitle{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.scards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.scard{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:#fff;cursor:pointer}
.scard:hover{border-color:var(--ink)}
.scard.sel{border-color:var(--ink);box-shadow:inset 3px 0 0 var(--ink)}
.scard h3{margin:0 0 4px}
.slist .srow{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:6px 0;background:#fff;cursor:pointer}
.slist .srow:hover{border-color:var(--ink)}
#wzMap{height:44vh;min-height:260px;border:1px solid var(--line);border-radius:10px;margin-top:8px;background:#0f1512;position:relative}
#wzMap::after{content:"";position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.5),inset 0 0 0 1px rgba(0,0,0,.5);pointer-events:none;z-index:500}
#wzMap::before{content:"";position:absolute;left:50%;top:50%;width:2px;height:2px;margin:-1px 0 0 -1px;background:#fff;z-index:501;pointer-events:none}
.wzsp{max-height:46vh;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:4px;background:#fff}
@media (max-width:640px){.scards{grid-template-columns:1fr}}
a{color:var(--water);text-decoration:none;border-bottom:1px solid rgba(47,111,163,.35)}
a:hover{border-bottom-color:var(--water)}
.refs{font-size:13px;margin-top:6px;line-height:1.9}
.refs a{margin-right:2px}
.photos{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0;align-items:flex-start}
.photos img{width:104px;height:78px;object-fit:cover;border-radius:6px;border:1px solid var(--line);display:block}
.photos a{border:0}
.bvwrap{margin:8px 0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#EEF0E8}
.heatbar{height:10px;border-radius:5px;margin:6px 0 2px;background:linear-gradient(90deg,rgb(180,71,30),rgb(201,162,39),rgb(61,122,74))}
.heatbest{background:#fff;color:#1E2A22;font-size:11px;font-weight:700;text-align:center;border-radius:10px;padding:2px 0;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.dialwrap{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:8px 0}
.dial{width:190px;height:190px;flex:0 0 auto}
.dialnote{flex:1 1 190px;min-width:170px}
.dwedge{transition:d .25s ease}
@media (prefers-reduced-motion:reduce){.dwedge{transition:none}}
.bvcal{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;margin:6px 0}
.bvcal div{border-radius:4px;padding:4px 0;text-align:center;background:var(--paper2);font-size:11px;line-height:1.25}
.bvcal div.on{background:#3D7A4A;color:#fff}
.bvcal div.thin{background:#C9A227;color:#1E2A22}
.bvcal div.gap{background:#F1D8CC;color:var(--alert)}
.bvcal div i{display:block;font-style:normal;opacity:.8;font-size:10px}
body.wide{--panelW:560px}
.hrlogo{width:78px;height:46px;color:var(--ink);vertical-align:middle;flex:0 0 auto}
#busy{position:absolute;left:50%;top:60px;transform:translateX(-50%);z-index:900;display:none;align-items:center;gap:10px;background:rgba(238,240,232,.96);border:1px solid var(--line);border-radius:10px;padding:7px 14px 7px 10px;box-shadow:0 2px 10px rgba(0,0,0,.25);font-size:13px;color:var(--ink)}
#busy.show{display:flex}
#busy .hrlogo{width:120px;height:70px}
/* the hedge grows left to right like a loading bar: ground sweeps, then each plant springs up in turn */
#busy .ground{stroke-dasharray:90;stroke-dashoffset:90}
#busy .p{transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(0);opacity:0}
#busy .bee{opacity:0}
#busy.show:not(.done) .ground{animation:hrground 4s cubic-bezier(.35,0,.25,1) infinite}
#busy.show:not(.done) .p{animation:hrspring 4s cubic-bezier(.34,1.56,.64,1) infinite}
#busy.show:not(.done) .p1{animation-delay:.25s} #busy.show:not(.done) .p2{animation-delay:.65s}
#busy.show:not(.done) .p3{animation-delay:1.05s} #busy.show:not(.done) .p4{animation-delay:1.45s}
#busy.show:not(.done) .bee{animation:hrbee 4s cubic-bezier(.4,0,.5,1) infinite}
#busy.show:not(.done) .beebody{animation:hrbob .55s ease-in-out infinite}
#busy.show:not(.done) .wing{transform-box:fill-box;transform-origin:80% 50%;animation:hrwing .09s linear infinite}
#busy.done .ground{stroke-dashoffset:0} #busy.done .p{transform:none;opacity:1} #busy.done .bee{opacity:1;transform:translate(83px,26px)}
@keyframes hrground{0%{stroke-dashoffset:90}45%{stroke-dashoffset:0}100%{stroke-dashoffset:0}}
@keyframes hrspring{0%,8%{transform:scaleY(0);opacity:0}22%{transform:scaleY(1.08);opacity:1}30%{transform:scaleY(1);opacity:1}94%{transform:scaleY(1);opacity:1}100%{transform:scaleY(1);opacity:0}}
@keyframes hrbee{0%,42%{opacity:0;transform:translate(6px,4px)}46%{opacity:1;transform:translate(20px,2px)}55%{transform:translate(44px,-6px)}63%{transform:translate(62px,6px)}71%{transform:translate(72px,-8px)}79%{transform:translate(84px,-2px)}86%,96%{transform:translate(83px,26px)}100%{opacity:0;transform:translate(83px,26px)}}
@keyframes hrbob{0%,100%{transform:rotate(-14deg) translateY(0)}50%{transform:rotate(-11deg) translateY(-.7px)}}
@keyframes hrwing{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.35)}}
@media (prefers-reduced-motion:reduce){#busy .ground,#busy .p,#busy .bee,#busy .beebody,#busy .wing{animation:none!important} #busy .ground{stroke-dashoffset:0} #busy .p{transform:none;opacity:1} #busy .bee{opacity:1}}
.goal{display:grid;grid-template-columns:1fr 96px;gap:8px;align-items:center;margin:4px 0;font-size:14px}
.goal input[type=range]{width:96px}
.cal{display:grid;grid-template-columns:repeat(12,1fr);gap:2px;margin:6px 0}
.cal span{height:14px;border-radius:2px;background:var(--paper2);font-size:9px;text-align:center;line-height:14px;color:var(--mute)}
.cal span.on{background:var(--ok);color:#fff}
.cal span.gap{background:#F1D8CC;color:var(--alert)}
.issue{font-size:13px;padding:3px 0 3px 8px;border-left:3px solid var(--line);margin:2px 0}
.issue.bad{border-color:var(--alert)} .issue.warn{border-color:var(--warn)} .issue.good{border-color:var(--ok)}
.hz{display:flex;gap:4px;margin:6px 0}
.hz button{flex:1;padding:4px 2px;font-size:13px}
.xsec{width:100%;height:auto;background:#fff;border:1px solid var(--line);border-radius:6px;margin:6px 0}
.conf{font-size:11px;color:var(--mute)}
.conf.obs{color:var(--ok)}
@media print{ #mapWrap,#tabs,#panelHead button,#modebar{display:none!important} #app{display:block} #panel{border:0} #panelBody{overflow:visible} .tab{display:none} .tab.on{display:block} }

  body.wide{--panelW:100%}
}

<script>
/* Capture the pristine page source as the very first thing this script does,
   before any DOM mutation (map init, panel renders, etc.) touches it — this
   is what the Download button saves, so it always reflects a clean, working copy. */
const _PAGE_SRC='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
function downloadApp(){
  try{ const blob=new Blob([_PAGE_SRC],{type:'text/html'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='hedgeright.html';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(a.href),2000);
    UI.toast('Downloading hedgeright.html'); }
  catch(e){ alert('Could not prepare the download: '+(e.message||e)); } }

/* ---------------- cloud sync (Cloudflare Worker + KV) ----------------
   One shared JSON blob, gated by a password set once per device. The Worker URL is
   fixed for this deployment; only the password lives in localStorage — recoverable
   from wherever you actually keep it (a password manager), same as any login. */
const CLOUD_SYNC_URL='https://hedgeright-sync.eric-carlson.workers.dev/design';
let cloudStatus={state:'unconfigured',msg:'',at:null};
function cloudToken(){ try{ return localStorage.getItem('hedgeright.cloudToken')||''; }catch(e){ return ''; } }
function setCloudTokenValue(t){ try{ localStorage.setItem('hedgeright.cloudToken',t); }catch(e){} }
function cloudDeployed(){ return !!(CLOUD_SYNC_URL&&!CLOUD_SYNC_URL.includes('YOUR-WORKER-SUBDOMAIN')); }
function cloudConfigured(){ return cloudDeployed()&&!!cloudToken(); }
async function cloudPull(){
  if(!cloudConfigured()) return null;
  try{ const r=await fetch(CLOUD_SYNC_URL,{headers:{'Authorization':'Bearer '+cloudToken()}});
    if(r.status===401){ cloudStatus={state:'error',msg:'wrong password',at:Date.now()}; renderCloudStatus(); return null; }
    if(!r.ok) throw new Error('HTTP '+r.status);
    const txt=await r.text(); cloudStatus={state:'ok',msg:'synced',at:Date.now()}; renderCloudStatus();
    if(!txt||txt==='null') return null; return JSON.parse(txt); }
  catch(e){ cloudStatus={state:'error',msg:(e&&e.message)||String(e),at:Date.now()}; renderCloudStatus(); return null; } }
async function cloudPush(){
  if(!cloudConfigured()) return;
  try{ const r=await fetch(CLOUD_SYNC_URL,{method:'PUT',headers:{'Authorization':'Bearer '+cloudToken(),'Content-Type':'application/json'},body:JSON.stringify(S)});
    if(r.status===401){ cloudStatus={state:'error',msg:'wrong password',at:Date.now()}; renderCloudStatus(); return; }
    if(!r.ok) throw new Error('HTTP '+r.status);
    cloudStatus={state:'ok',msg:'synced',at:Date.now()}; }
  catch(e){ cloudStatus={state:'error',msg:(e&&e.message)||String(e),at:Date.now()}; }
  renderCloudStatus(); }
function renderCloudStatus(){ const els=document.querySelectorAll('.cloudStatusEl'); if(!els.length) return;
  let text;
  if(!cloudDeployed()) text='Worker not deployed yet.';
  else if(!cloudToken()) text='No password set on this device.';
  else if(cloudStatus.state==='ok') text='Synced'+(cloudStatus.at?' · '+new Date(cloudStatus.at).toLocaleTimeString():'');
  else if(cloudStatus.state==='error') text='Sync failed: '+cloudStatus.msg;
  else text='Not yet synced this session.';
  els.forEach(el=>el.textContent=text); }
async function saveCloudToken(inputId){ inputId=inputId||'cloudToken'; const inp=document.getElementById(inputId); if(!inp) return; setCloudTokenValue(inp.value.trim());
  renderCloudStatus(); const data=await cloudPull();
  if(data){ commit('Pull cloud sync',()=>{ S=data; normalizeState(); }); if(map){ map.setView(R().center,R().zoom); drawAll(); } renderPanels(); } }
function clearCloudToken(){ setCloudTokenValue(''); cloudStatus={state:'unconfigured',msg:'',at:null};
  ['cloudToken','cloudTokenDlg'].forEach(id=>{ const el=document.getElementById(id); if(el) el.value=''; });
  renderCloudStatus(); renderPanels(); }

function containerForTier(sp){ if(sp.story==='over') return 5; if(sp.story==='mid') return 5; return 1; }
function loadPlan(h,vehicle){ const items=plantingOrder(h); const cap=(VEHICLES[vehicle]||VEHICLES.truck).cuft; let loads=[[]],cur=0;
  items.forEach(x=>{ const c=CONTAINER[containerForTier(x.p.sp)].cuft; if(cur+c>cap){ loads.push([]); cur=0; } loads[loads.length-1].push(x); cur+=c; }); return loads; }
function batchPlan(h){ const order=plantingOrder(h); const batches={}; order.forEach(x=>{ const k=x.p.sp.story; (batches[k]=batches[k]||[]).push(x); }); return batches; }
function dayPlan(h,vehicle){ const loads=loadPlan(h,vehicle||'truck'); const batches=batchPlan(h); return {loads,batches,total:plantingOrder(h).length}; }
function renderDay(){ const h=curHedge(); if(!h) return;
  const dp=dayPlan(h); let html=`<h2>Planting day — ${esc(h.name)}</h2><p class="small">${dp.total} plants, ${dp.loads.length} vehicle load${dp.loads.length===1?'':'s'}.</p>`;
  html+=dp.loads.map((load,i)=>`<details ${i===0?'open':''}><summary>Load ${i+1} (${load.length} plants)</summary>`+load.map(x=>`<div class="small">${esc(x.p.sp.common)} — ${esc(x.p.r.name)} @ ${x.p.ft} ft</div>`).join('')+`</details>`).join('');
  setHtml('tab-day',html); }
function markSectionsOnMap(){ }
function exportDayCSV(){ const h=curHedge(); if(!h) return; const rows=[['#','species','row','ft']]; plantingOrder(h).forEach((x,k)=>rows.push([k+1,x.p.sp.common,x.p.r.name,x.p.ft]));
  downloadCSV('planting-day.csv',rows); }
const PLANT_PRICE={1:6,5:22,15:65};
const STATUS=['needed','ordered','picked up','planted'];
function catalog(h){ const cnt={}; h.rows.forEach(r=>r.plants.forEach(p=>cnt[p.sp]=(cnt[p.sp]||0)+1)); return Object.keys(cnt).map(id=>({sp:SP(id),n:cnt[id]})).filter(x=>x.sp); }
function shopState(){ R().shop=R().shop||{}; return R().shop; }
function shopLines(h){ return catalog(h).map(c=>{ const tier=containerForTier(c.sp); return {id:c.sp.id,sp:c.sp,n:c.n,tier,unit:PLANT_PRICE[tier],status:shopState()[c.sp.id]||'needed'}; }); }
function lineCost(l){ return l.n*l.unit; }
function shopTotals(lines){ return lines.reduce((a,l)=>a+lineCost(l),0); }
function setShop(id,status){ shopState()[id]=status; saveSoon(); renderShop(); }
function cycleStatus(id){ const cur=shopState()[id]||'needed'; const i=STATUS.indexOf(cur); setShop(id,STATUS[(i+1)%STATUS.length]); }
const CA_PROGRAMS=[{name:'NRCS EQIP — hedgerow planting',url:'https://www.nrcs.usda.gov/programs-initiatives/eqip-environmental-quality-incentives-program',note:'Cost-share for conservation plantings; apply through your local NRCS office.'},
  {name:'CDFA Healthy Soils Program',url:'https://www.cdfa.ca.gov/oefi/healthysoils/',note:'Hedgerow and cover crop incentives on ag land.'},
  {name:'RCD technical assistance',url:'https://www.carcd.org/',note:'Your local Resource Conservation District can help design and often part-fund a hedgerow.'}];
function renderShop(){ const h=curHedge(); if(!h){ setHtml('tab-shop',`<p class="small mute">Select a hedgerow.</p>`); return; }
  const lines=shopLines(h); if(!lines.length){ setHtml('tab-shop',`<p class="small mute">Nothing planted yet.</p>`); return; }
  const total=shopTotals(lines);
  let html=`<h2>${esc(h.name)} — cost</h2><p class="small">${lines.reduce((a,l)=>a+l.n,0)} plants · <b>$${total.toLocaleString()}</b> at retail nursery prices</p>`;
  html+=`<table><tr><th>Species</th><th class="num">Qty</th><th>Size</th><th class="num">Cost</th><th>Status</th></tr>`
    +lines.map(l=>`<tr><td>${esc(l.sp.common)}</td><td class="num">${l.n}</td><td>${CONTAINER[l.tier].label}</td><td class="num">$${lineCost(l).toLocaleString()}</td>
      <td><button class="small" onclick="cycleStatus('${l.id}')">${l.status}</button></td></tr>`).join('')+`</table>`;
  html+=`<div class="row"><button class="small" onclick="exportShopCSV()">Export CSV</button></div>`;
  html+=`<h2>Funding</h2>`+CA_PROGRAMS.map(p=>`<p class="small"><a href="${p.url}" target="_blank" rel="noopener">${esc(p.name)}</a><br><span class="mute">${esc(p.note)}</span></p>`).join('');
  setHtml('tab-shop',html); }
function addShopLine(){ }
function exportShopCSV(){ const h=curHedge(); if(!h) return; const lines=shopLines(h); const rows=[['species','qty','size','unit cost','line cost','status']];
  lines.forEach(l=>rows.push([l.sp.common,l.n,CONTAINER[l.tier].label,l.unit,lineCost(l),l.status])); downloadCSV('plant-shopping-list.csv',rows); }
function shopDocHtml(h){ const lines=shopLines(h); const total=shopTotals(lines);
  return `<h2>Shopping list</h2><table border="1" cellpadding="4" style="border-collapse:collapse;width:100%"><tr><th>Species</th><th>Qty</th><th>Size</th><th>Cost</th></tr>`
    +lines.map(l=>`<tr><td>${esc(l.sp.common)}</td><td>${l.n}</td><td>${CONTAINER[l.tier].label}</td><td>$${lineCost(l)}</td></tr>`).join('')+`</table><p><b>Total: $${total.toLocaleString()}</b></p>`; }
function downloadCSV(name,rows){ const csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\\n');
  const blob=new Blob([csv],{type:'text/csv'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click(); }
function shoppingHtml(h){ return shopDocHtml(h); }
function justificationHtml(h){ const j=justify(h); return j.map(row=>`<h3>${esc(row.row.name)} — ${esc(REGIMES[row.row.regime])}</h3>`
  +row.items.map(it=>`<p><b>${esc(it.sp.common)}</b> (${it.n}×, avg spacing ${it.avgSp?it.avgSp.toFixed(1)+' ft':'—'})<br>
    ${esc(it.storyText)}<br>${esc(it.shading)}<br>${esc(it.succession)}<br>${esc(it.placement)}<br>${esc(it.roots)}<br>
    ${it.canopyNotes.length?it.canopyNotes.map(c=>'Yr '+c.y+': '+c.notes.map(n=>n.t).join('; ')).join('<br>'):''}<br>
    <i>If it fails:</i> ${esc(it.fail||'')} ${it.replace?'Replace with '+esc(it.replace.common)+'.':''}</p>`).join('')).join(''); }
function renderReport(){ const h=curHedge(); if(!h){ setHtml('tab-report',`<p class="small mute">Select a hedgerow.</p>`); return; }
  const ids=bloomStats(h);
  let html=`<h2>${esc(h.name)} — plan</h2>`;
  html+=bloomDialBlock(ids);
  html+=`<div class="row"><button class="primary" onclick="exportPlanDoc()">Export full plan (printable HTML)</button><button class="small" onclick="exportCSV()">Export plant list CSV</button><button class="small" onclick="exportJSON()">Export design JSON</button></div>`;
  html+=`<h3>Justification</h3>`+justificationHtml(h);
  setHtml('tab-report',html); }
function exportPlanDoc(){ const h=curHedge(); if(!h) return;
  const doc=`<!DOCTYPE html><html><head><meta charset="utf-8"><title>${esc(h.name)} — HedgeRight plan</title>
  <style>body{font-family:Georgia,serif;max-width:760px;margin:40px auto;padding:0 20px;color:#1E2A22}h1,h2,h3{font-family:Arial,sans-serif}
  table{border-collapse:collapse;width:100%}td,th{border:1px solid #ccc;padding:5px 8px;font-size:13px}</style></head><body>
  <h1>${esc(h.name)} — Hedgerow Plan</h1><p>${esc(R().name)} · generated ${new Date().toLocaleDateString()}</p>
  ${shoppingHtml(h)}
  <h2>Bloom coverage</h2>${bloomDialBlock(bloomStats(h))}
  <h2>Row-by-row justification</h2>${justificationHtml(h)}
  </body></html>`;
  const blob=new Blob([doc],{type:'text/html'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=(h.name||'plan').replace(/\\s+/g,'-')+'-plan.html'; a.click(); }
function exportCSV(){ const h=curHedge(); if(!h) return; const rows=[['row','species','sci','ft','regime']];
  h.rows.forEach(r=>r.plants.forEach(p=>{ const sp=SP(p.sp); rows.push([r.name,sp?sp.common:p.sp,sp?sp.sci:'',p.ft,r.regime]); })); downloadCSV((h.name||'plan')+'-plants.csv',rows); }
function exportJSON(){ const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='hedgeright-design.json'; a.click(); }
async function importJSON(file){ try{ const txt=await file.text(); const st=JSON.parse(txt); if(!st.ranches) throw new Error('not a design file');
    commit('Import design',()=>{ S=st; normalizeState(); }); if(map){ map.setView(R().center,R().zoom); drawAll(); } renderPanels(); UI.toast('Imported'); }
  catch(e){ UI.alert('Could not read that file: '+(e.message||e),'Import failed'); } }
function normalizeState(){ if(!S.species) S.species=JSON.parse(JSON.stringify(SPECIES_DEFAULT));
  S.species.forEach(sp=>{ const def=SPECIES_DEFAULT.find(d=>d.id===sp.id); if(def) Object.keys(def).forEach(k=>{ if(sp[k]===undefined) sp[k]=def[k]; }); });
  S.ranches.forEach(r=>{ r.hexCache=r.hexCache||{}; r.water=r.water||{nodes:[],lines:[]}; r.creeks=r.creeks||[]; r.goals=r.goals||{}; r.plan=r.plan||{set:[]};
    r.origin=r.origin||r.center.slice();
    r.hedgerows.forEach(h=>{ h.rows.forEach(rr=>{ rr.plants=rr.plants||[]; }); }); });
  if(!S.sel) S.sel={hedge:null,row:null,species:null,wnode:null,wline:null}; }
function renderPanels(){ const t=currentTab(); renderTabIfNeeded(t); renderStageHint(t); updateHistButtons(); saveBadge(); fsBadge(); netBadge();
}
let curSave=null;
function saveIndexKey(){ return 'hedgeright.saves.index'; }
function saveIndex(){ try{ return JSON.parse(localStorage.getItem(saveIndexKey())||'[]'); }catch(e){ return []; } }
function putIndex(idx){ try{ localStorage.setItem(saveIndexKey(),JSON.stringify(idx)); }catch(e){} }
function designSummary(){ const rs=S.ranches.length; const hs=S.ranches.reduce((a,r)=>a+r.hedgerows.length,0); return rs+' ranch'+(rs===1?'':'es')+', '+hs+' hedgerow'+(hs===1?'':'s'); }
async function saveAs(name){ try{ localStorage.setItem('hedgeright.save.'+name,JSON.stringify(S)); const idx=saveIndex(); const ex=idx.find(x=>x.name===name);
    if(ex) ex.at=Date.now(); else idx.push({name,at:Date.now()}); putIndex(idx); curSave={id:name,name}; markDirty(false); UI.toast('Saved as "'+name+'"'); }
  catch(e){ UI.alert('Could not save: '+(e.message||e)); } }
async function openSave(name){ try{ const txt=localStorage.getItem('hedgeright.save.'+name); if(!txt) throw new Error('not found');
    S=JSON.parse(txt); normalizeState(); curSave={id:name,name}; hideStart(); if(map){ map.setView(R().center,R().zoom); drawAll(); } renderPanels(); }
  catch(e){ UI.alert('Could not open "'+name+'": '+(e.message||e)); } }
function deleteSave(name){ localStorage.removeItem('hedgeright.save.'+name); putIndex(saveIndex().filter(x=>x.name!==name)); if(curSave&&curSave.name===name) curSave=null; refreshRanchesSavesView(); }
function saveNow(){ if(curSave) saveAs(curSave.name); else promptSaveAs(); if(FS.handle) fsWrite(); }
async function promptSaveAs(){ const name=await UI.prompt('Name this design',curSave?curSave.name:R().name,{title:'Save as'}); if(name) saveAs(name); }
function snapListKey(){ return 'hedgeright.snaps.'+(curSave?curSave.name:'unsaved'); }
function snapList(){ try{ return JSON.parse(localStorage.getItem(snapListKey())||'[]'); }catch(e){ return []; } }
function snapPut(list){ try{ localStorage.setItem(snapListKey(),JSON.stringify(list)); }catch(e){} }
function snapTake(label){ const list=snapList(); list.push({id:uid(),label:label||new Date().toLocaleString(),at:Date.now(),data:JSON.stringify(S)}); if(list.length>20) list.shift(); snapPut(list); UI.toast('Snapshot taken'); }
function snapRestore(id){ const s=snapList().find(x=>x.id===id); if(!s) return; commit('Restore snapshot',()=>{ S=JSON.parse(s.data); normalizeState(); }); if(map) drawAll(); renderPanels(); }
function snapDelete(id){ snapPut(snapList().filter(x=>x.id!==id)); }
function saveState(){ return localStorage.getItem('hedgeright.dirty')==='1'?'dirty':'ok'; }
let _dirty=false;
let autoSaveOn=true;
function loadAutoSavePref(){ try{ const v=localStorage.getItem('hedgeright.autoSave'); autoSaveOn=v===null?true:v==='1'; }catch(e){ autoSaveOn=true; } }
function setAutoSave(on){ autoSaveOn=on; try{ localStorage.setItem('hedgeright.autoSave',on?'1':'0'); }catch(e){} saveBadge(); if(on&&_dirty) persistNow(); }
function markDirty(v){ _dirty=v===undefined?true:v; saveBadge(); }
function saveBadge(){ const box=document.getElementById('autoSaveBox'); if(box) box.checked=autoSaveOn;
  const btn=document.getElementById('saveBtn'); if(btn){ btn.style.display=autoSaveOn?'none':''; btn.disabled=!_dirty;
    btn.classList.toggle('dirty',_dirty); btn.title=_dirty?'Unsaved changes — click to save (Ctrl+S)':'Nothing to save'; } }
/* What "save" actually does: write the unnamed autosave copy, push to the cloud if
   configured, and update the named save slot too if this design has one. Runs either
   on the auto-save debounce or from a manual click — same work either way. */
function persistNow(){ try{ localStorage.setItem('hedgeright.autosave',JSON.stringify(S)); }catch(e){}
  if(curSave) saveAs(curSave.name); else markDirty(false);
  cloudPush(); }
function manualSaveClick(){ clearTimeout(_saveT); persistNow(); }
let _saveT=null;
function saveSoon(){ markDirty(true); if(!autoSaveOn) return; clearTimeout(_saveT); _saveT=setTimeout(persistNow,1200); }
function toggleSaveMenu(e){ if(e) e.stopPropagation(); const w=document.getElementById('saveWrap'); w.classList.toggle('open');
  document.getElementById('saveMenuHolder').innerHTML=w.classList.contains('open')?`<div class="menu">
    <button onclick="promptSaveAs();toggleSaveMenu()">Save as… <kbd>Ctrl+S</kbd></button>
    <button onclick="toggleSaveMenu();openRanchesSavesDialog(false)">Open a saved design…</button>
    <button onclick="snapTake();toggleSaveMenu()">Take a snapshot</button>
    <div class="sep"></div>
    <button onclick="exportJSON();toggleSaveMenu()">Export JSON</button>
    <button onclick="document.getElementById('impInput').click();toggleSaveMenu()">Import JSON…</button>
    <div class="sep"></div>
    <button onclick="fsLink();toggleSaveMenu()">${FS.handle?'Re-link file…':'Link to a file on disk…'}</button>
  </div>`:''; }
document.addEventListener('click',e=>{ const w=document.getElementById('saveWrap'); if(w&&w.classList.contains('open')&&!w.contains(e.target)) w.classList.remove('open'); });
function savesHtml(){ const idx=saveIndex().sort((a,b)=>b.at-a.at);
  if(!idx.length) return `<p class="small mute">Nothing saved yet.</p>`;
  return `<div class="slist">`+idx.map(s=>`<div class="srow" onclick="openSave('${esc(s.name)}')"><span class="grow">${esc(s.name)}</span><span class="small mute">${new Date(s.at).toLocaleDateString()}</span>
    <button class="small danger" onclick="event.stopPropagation();deleteSave('${esc(s.name)}')">Delete</button></div>`).join('')+`</div>`; }
function showStart(){ const d=document.getElementById('dlg'); if(d&&d.classList.contains('show')) UI.close(null); document.getElementById('start').classList.add('show'); renderStart(); }
function hideStart(){ document.getElementById('start').classList.remove('show'); const d=document.getElementById('dlg'); if(d&&d.classList.contains('show')) UI.close(null); }
/* Same picker as renderStart()/#start, but as a modal over the map instead of a full-screen
   takeover — used when opened from Settings or the save menu. Shares the same action handlers
   (startNew, hideStart, openSave, savesHtml) since hideStart() now closes this dialog too. */
function renderRanchesSavesBody(){
  return `<div class="scards">
    <div class="scard" onclick="startNew()"><h3>New design</h3><p class="small mute">Start from a map location.</p></div>
    <div class="scard" onclick="hideStart()"><h3>Continue</h3><p class="small mute">${esc(designSummary())}</p></div>
  </div>
  <h2>Saved designs</h2>${savesHtml()}
  <input type="file" id="impInputDlg" accept=".json,.hedgeright.json" style="display:none" onchange="if(this.files[0]){ importJSON(this.files[0]); }">
  <div class="row" style="margin-top:10px"><button class="small" onclick="document.getElementById('impInputDlg').click()">Import JSON…</button>
    <button class="small" onclick="fsOpen()">Open a file from disk…</button></div>`; }
function refreshRanchesSavesView(){ const d=document.getElementById('dlg'); const t=document.getElementById('dlgT');
  if(d&&d.classList.contains('show')&&t&&t.textContent==='Ranches & saves'){ const b=document.getElementById('dlgB'); if(b) b.innerHTML=renderRanchesSavesBody(); }
  else renderStart(); }
function openRanchesSavesDialog(returnToSettings){
  const actions=returnToSettings?[{label:'← Settings',value:'back'},{label:'Close',primary:true,value:null}]:[{label:'Close',primary:true,value:null}];
  UI.open('Ranches & saves','<div style="max-height:70vh;overflow:auto">'+renderRanchesSavesBody()+'</div>',actions).then(v=>{ if(v==='back') openSettingsDialog(); }); }
function renderStart(){ const html=`<div class="stitle"><h1>HedgeRight</h1></div>
  <p class="mute">California native hedgerows, planned by goal and grown on paper first.</p>
  <div class="scards">
    <div class="scard" onclick="startNew()"><h3>New design</h3><p class="small mute">Start from a map location.</p></div>
    <div class="scard" onclick="hideStart()"><h3>Continue</h3><p class="small mute">${esc(designSummary())}</p></div>
  </div>
  <h2>Saved designs</h2>${savesHtml()}
  <input type="file" id="impInput" accept=".json,.hedgeright.json" style="display:none" onchange="if(this.files[0]) importJSON(this.files[0])">
  <div class="row" style="margin-top:10px"><button class="small" onclick="document.getElementById('impInput').click()">Import JSON…</button>
    <button class="small" onclick="fsOpen()">Open a file from disk…</button></div>`;
  setHtml('startBody',html); }
function startNew(){ const r=blankRanch('New ranch',R()?R().center:[38.889326,-123.162412],R()?R().zoom:15); S.ranches.push(r); S.active=r.id; curSave=null;
  hideStart(); if(map){ map.setView(r.center,r.zoom); drawAll(); } renderPanels(); showTab('ranch'); }
function finishWizard(){ hideStart(); }
(async function boot(){
  loadAutoSavePref();
  let loaded=false;
  if(cloudConfigured()){ const cloud=await cloudPull(); if(cloud){ S=cloud; loaded=true; } }
  if(!loaded){
    try{ const saved=localStorage.getItem('hedgeright.autosave'); S=saved?JSON.parse(saved):defaultState(); }
    catch(e){ S=defaultState(); }
  }
  normalizeState();
  if(typeof L==='undefined'||!L.map){
    document.getElementById('start').classList.add('show');
    setHtml('startBody',`<h1 style="font-size:21px">The map library did not load</h1>
      <p class="small">HedgeRight draws on Leaflet and Esri imagery from the internet. Something blocked that — no connection, a firewall, or a viewer that will not fetch outside files.</p>
      <p class="small">Try reloading. Your saved designs are untouched either way, and JSON import/export still works.</p>
      <div class="row"><button class="small" onclick="location.reload()">Try again</button>
        <button class="small" onclick="document.getElementById('impStart').click()">Import JSON</button>
        <input id="impStart" type="file" accept="application/json" style="display:none" onchange="if(this.files[0]) importJSON(this.files[0])"></div>`);
    return;
  }
  try{ initMap(); }
  catch(e){
    document.getElementById('start').classList.add('show');
    setHtml('startBody',`<h1 style="font-size:21px">The map failed to start</h1><p class="small">${esc(e.message||String(e))}</p>
      <div class="row"><button class="small" onclick="location.reload()">Try again</button></div>`);
    return;
  }
  const lh=document.getElementById('lyHex'); if(lh) lh.checked=false;
  renderPanels();
  showTab('ranch');
  renderCloudStatus();
  window.addEventListener('beforeunload',()=>{ try{ localStorage.setItem('hedgeright.autosave',JSON.stringify(S)); }catch(e){} });
})();
</script>
</body>
</html>
